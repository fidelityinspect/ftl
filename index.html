  else if (n.id === R.pos) card = `<b>YOU ARE HERE · ${esc(planetOf(n.seed).toUpperCase())}</b><span>${n.probed ? "You've already probed this world." : "Send a probe down and see what the world gives you. Free, and once per beacon."}</span>`;
  else if (n.col <= R.threat && n.type !== "flagship") card = `<b><span class="tag" style="color:#ff3d5a">OVERRUN</span>${esc(String(pursuer().name || threatName()).toUpperCase())}</b><span>${({fleet:"Its vanguard holds this beacon. A hard fight and nothing worth salvaging.", swarm:"The swarm has nested here. Expect a fight against something that doesn't need a crew.", nova:"The shockfront has burned through here. No enemy, just fire. You'd have to outlast it.", void:"The dark has taken this beacon. No enemy, just cold. You'd have to outlast it."})[pursuer().kind] || ""}</span>`;
  else if (n.type === "hazard") card = `<b><span class="tag" style="color:#ffc857">HAZARD</span>${esc(({asteroids:"ASTEROID FIELD", flare:"SOLAR STORM", ion:"ION STORM"})[n.hz] || "HAZARD")}</b><span>Dangerous, and rich if you're willing to sit in it. You can pass it by. ${esc(planetOf(n.seed))}.</span>`;
  else if (n.visited) card = `<b>VISITED</b><span>Empty space now. Jumping here still costs fuel and time.</span>`;
  else if (n.col <= R.threat + 1 && n.type !== "flagship" && n.type !== "exit" && reachable().includes(n.id)) card = `<b><span class="tag" style="color:#ff9b5c">PURSUIT</span>${esc(String(pursuer().name || threatName()).toUpperCase())} WILL BE HERE FIRST</b><span>Jump here and you meet the pursuit, not what the scanners show. Every jump lets it close in.</span>`;
  else if (n.type === "hostile"){ const s = scout(n); card = `<b><span class="tag" style="color:${s.danger[1]}">${s.danger[0]}</span>${esc(s.e.name)}</b><span>${sizeRule(s.e).label} ship · Hull ${s.e.hull} · ${(n_ => `${n_} shield layer${n_ === 1 ? "" : "s"}`)(Math.floor((s.e.sys.shields ? s.e.sys.shields.level : 0)/MOD.rules.powerPerLayer))} · ${s.e.weapons.map(w => w.name).join(", ")}${s.e.sys.cloak ? " · cloak" : ""}${s.e.sys.tele ? " · boarders" : ""}${s.e.sys.lock ? " · warp lock" : ""}${s.e.drones.length ? " · drones" : ""} · salvage ${s.loot}${s.e.notes.length ? "<br>Scouts: " + esc(s.e.notes.join(" ")) : ""}</span>`; }
  else if (n.type === "event") card = `<b><span class="tag" style="color:#d9e2f2">SIGNAL</span>UNKNOWN BROADCAST</b><span>Something is transmitting from near a ${esc(planetOf(n.seed))}. Could be anything.</span>`;
  else if (n.type === "store") card = `<b><span class="tag" style="color:#ffc857">TRADER</span>A MERCHANT BEACON</b><span>Fuel, missiles, repairs and gear, for scrap.</span>`;
  else if (n.type === "wreck") card = `<b><span class="tag" style="color:#9fb0cc">WRECK</span>THE ${esc(n.wreck.ship)}</b><span>A ship of your own line, dead in space. Captain №${n.wreck.n}, lost in sector ${n.wreck.sector}.</span>`;
  else if (n.type === "exit") card = `<b><span class="tag" style="color:#7cf29a">EXIT</span>JUMP TO SECTOR ${R.sector + 1}</b><span>Leave this sector behind. ${esc(capFirst(threatName()))} follows.</span>`;
  else if (n.type === "flagship") card = ending().kind === "escape"
    ? `<b><span class="tag" style="color:#ff3d5a">THE END</span>${esc(String(ending().name || "THE END").toUpperCase())}</b><span>${esc(ending().what || "")} No flagship. You win by surviving until the drive spools.</span>`
    : `<b><span class="tag" style="color:#ff3d5a">FLAGSHIP</span>${esc((R.arc ? R.arc.threat.flagship : "THE FLAGSHIP").toUpperCase())}</b><span>The end of the line. Everything you have built meets it here.</span>`;
  else card = `<b>BEACON</b>`;
  $("mapCard").innerHTML = card;
  const here = R.map.nodes[R.pos], pb = $("probeBtn");
  pb.disabled = !!R.jumping || !here || !!here.probed; pb.textContent = here && here.probed ? "PROBED" : "PROBE";
  const jb = $("jumpBtn");
  jb.disabled = !reach || !!R.jumping;

function doJump(){
  if (!R || S.mode !== "map" || R.sel == null || R.jumping) return;
  const n = R.map.nodes[R.sel]; if (!reachable().includes(n.id)) return;
  R.jumping = true;
  let drift = false;
  if (R.fuel <= 0){ drift = true; R.you.hull -= 3; R.threat += 1; R.log.push("Drifted a jump on emergency thrust, burning hull plating."); }
  else R.fuel--;
  R.threat += 1; R.jumps++;
  for (const d of R.debts) d.due--;
  R.pos = n.id; R.sel = null;
  // save on arrival, before the encounter: a closed tab comes back to this beacon, not the one before the jump
  R.pendingArrive = {id: n.id, first: !n.visited}; saveRun();
  if (STAGE.ok) STAGE.focus(n.id);
  S.warp = 1; AUDIO.sfx("jump");
  buildMapDeck();
  if (R.you.hull <= 0){ setTimeout(() => gameOver(false, "the jump that tore the hull apart"), 800); return; }
  setHint(drift ? "No fuel. You burn hull plating for thrust." : "");
  setTimeout(() => arrive(n), 800);
}
// The beacon you just reached is saved with its event and its dice, so a reload + CONTINUE brings back the
// same event (and the same answer if you'd already chosen) instead of a reroll.
function pinRoll(key){ const p = R.pendingArrive; if (!p) return Math.random(); if (p[key] == null){ p[key] = Math.random(); saveRun(); } return p[key]; }
function pinEvent(make){ const p = R.pendingArrive; if (p && p.ev) return runEvent(p.ev); const ev = make(); if (p){ p.ev = ev; saveRun(); } return runEvent(ev); }
function arrive(n){
  R.jumping = false;
  if (STAGE.ok){ STAGE.setBeacon(n.seed, R.sector); STAGE.local = true; }
  const first = !n.visited; n.visited = true;
  if (R.pendingArrive && R.pendingArrive.id === n.id && R.pendingArrive.ev) return runEvent(R.pendingArrive.ev);
  const due = R.debts.find(d => d.due <= 0);
  if (due){ R.debts = R.debts.filter(d => d !== due); return pinEvent(() => reckoningFor(due)); }
  if (n.col <= R.threat && n.type !== "flagship") return overrun();
  if (!first){ R.pendingArrive = null; setHint("Empty space. The Threat draws closer."); saveRun(); return buildMapDeck(); }
  const hunted = R.you.hull < R.you.maxHull*0.4;
  if (n.type === "hostile"){
    const s = scout(n);
    const flee = clamp((R.rep - 4*(s.e.tier+1)*R.sector)/24, 0, 0.55);
    if (s.danger[0] === "EASY PREY" && pinRoll("flee") < flee){
      const g = 6 + Math.floor(pinRoll("fleeScrap")*8); R.scrap += g;
      return outcomeSheet(`${s.e.name} RUNS`, `The ${s.e.name} reads the kill marks on your hull and bolts before you are in range. It dumps cargo to lighten the burn.`, [`+${g} scrap`], [], () => returnToMap());
    }
    if (sizeRank(s.e) > sizeRank(R.you) && s.danger[0] !== "EASY PREY") return slipSheet(n, s);
    return fightAt(tplByName(n.tpl), {seed:n.seed});
  }
  if ((n.type === "event" || n.type === "store") && hunted && pinRoll("hunt") < (n.type === "store" ? 0.15 : 0.3)){
    const tier = clamp(R.sector - 1, 0, 3); const pool = MOD.enemies.filter(e => e.tier === tier);
    const hp = pool.length ? pool : MOD.enemies; // the same hunter on a reload
    return fightAt(hp[n.seed % hp.length], {seed: (n.seed ^ 0x2c1b) >>> 0, intro:"They smelled a wounded ship."});
  }
  if (n.type === "event") return pinEvent(nextEvent);
  if (n.type === "store") return openStore(n);
  if (n.type === "wreck") return pinEvent(() => wreckEvent(n.wreck));
  if (n.type === "hazard") return hazardSheet(n);
  if (n.type === "exit") return nextSector();
  if (n.type === "flagship") return fightBoss();
  returnToMap();
}
// A smaller ship can run dark past a bigger one. Engines, sensors and a cloak help; if they spot you,
// the fight starts with their guns already half charged.
function slipChance(e){
  const you = R.you, lv = id => you.sys[id] ? you.sys[id].level - (you.sys[id].dmg || 0) : 0;
  return clamp(Math.round((sizeRule(you).hide || 0) + 5*Math.max(0, lv("engines") - 1) + 5*lv("sensors") + (you.sys.cloak ? 20 : 0) - 10*Math.max(0, sizeRank(e) - sizeRank(you) - 1)), 10, 90);
}
function slipSheet(n, s){
  const ch = slipChance(s.e);
  sheet(`<h2>${esc(sizeRule(s.e).label)} SHIP: ${esc(s.e.name)}</h2>
    <p>It is bigger than you: hull ${s.e.hull}, ${s.e.weapons.length} guns, ${s.e.crew.length} crew${s.e.sys.lock ? ", and a warp lock that will hold your drive" : ""}. It hasn't seen you yet.</p>
    <button class="choice" id="slGo"><b>Slip past · ${ch}%</b><span>Run dark and leave the beacon behind. No salvage. If they spot you, the fight starts with their guns already warm.</span></button>
    <button class="choice" id="slFight"><b>Fight it</b><span>A hard fight. Kill the crew and the ship could be yours.</span></button>`);
  $("slGo").addEventListener("click", () => {
    AUDIO.sfx("click");
    if (pinRoll("slip")*100 < ch) return outcomeSheet("SLIPPED PAST", `Engines low, lights off. The ${s.e.name} sweeps the beacon and finds nothing. You're gone before it looks again.`, [], [], () => returnToMap());
    fightAt(tplByName(n.tpl), {seed:n.seed, warm:true, intro:"They saw you."});
  });
  $("slFight").addEventListener("click", () => { AUDIO.sfx("click"); fightAt(tplByName(n.tpl), {seed:n.seed}); });
}
// the same beacon always holds the same vanguard, so a reload mid-fight brings back the ship you were fighting
function vanguardTpl(seed){ const tier = clamp(R.sector, 1, 3), pool0 = MOD.enemies.filter(e => e.tier === tier), pool = pool0.length ? pool0 : MOD.enemies;
  return {...clone(seed == null ? pick(pool) : pool[Math.abs(seed) % pool.length]), name: "VANGUARD"}; }
function fightAt(tpl, opts = {}){
  const foe = buildEnemy(tpl, R.sector, opts.seed ?? Math.floor(Math.random()*1e9), {threat: opts.threat, name: opts.name});
  S = null;
  R.after = opts.after || null;
  startFight(foe, opts);
  if (opts.warm) for (const w of foe.weapons) w.charge = w.cd*0.6;
}
function pursuer(){ return (R.arc && R.arc.pursuer) || {kind:"fleet", name: threatName()}; }
function ending(){ return (R.arc && R.arc.ending) || {kind:"battle"}; }
function fightEnv(kind, opts = {}){
  S = null; R.after = null;
  startFight(buildEnv(kind, opts), {intro: opts.intro || "", boss: !!opts.finale});
}
function swarmTpl(){
  const s = R.sector;
  return {name:"THE SWARM", tier: clamp(s - 1, 0, 3), hull: 6 + 3*s, crew: 2, species:"myrm", missiles: 0,
    systems:{weapons:{level: 2 + s}, engines:{level: 3}, pilot:{level: 1}, drones:{level: 2}}, weapons: s >= 3 ? ["flak","basic"] : ["basic","basic"], drones:["combat"]};
}
function overrun(){
  const p = pursuer(), nm = p.name || threatName();
  if (p.kind === "swarm") return fightAt(swarmTpl(), {threat:true, intro:`${capFirst(nm)} got here first. It is everywhere at once.`});
  if (p.kind === "nova") return fightEnv("nova", {name:"THE SHOCKFRONT", heat:1.25, intro:`${capFirst(nm)} caught up. The lane is on fire. Spool the drive.`});
  if (p.kind === "void") return fightEnv("void", {name:"THE SILENCE", heat:1.3, intro:`${capFirst(nm)} got here first. The stars are going out one by one. Spool the drive.`});
  const here = R.map && R.map.nodes[R.pos], vs = here ? (here.seed ^ 0x5bd1) >>> 0 : undefined;
  return fightAt(vanguardTpl(vs), {threat:true, seed: vs, intro:`The vanguard of ${nm} holds this beacon.`});
}
const HAZARDS = {
  asteroids:{title:"A Field Full of Money", text:"Rocks, thousands of them, tumbling slow. The spectrometer lights up like a slot machine: nickel, iridium, a seam of something {crew} has only read about. The rocks do not care how much they're worth. They hit just as hard.", verb:"Mine it"},
  flare:{title:"A Star Having a Bad Day", text:"The local sun is throwing flares every few minutes. In between, the solar wind is thick enough to skim, and the ship's collectors could drink their fill. The last flare stripped paint off a buoy eight light-minutes out.", verb:"Skim the wind"},
  ion:{title:"The Violet Storm", text:"An ion storm, purple and silent, rolls through the beacon. Inside it the static would scramble half your systems. It would also charge your capacitors and dump a salvage drone's worth of ionized scrap onto your hull. {crew} is already suiting up. {crew} hasn't asked.", verb:"Ride it out"}
};
function hazardSheet(n){
  const h = HAZARDS[n.hz] || HAZARDS.asteroids, reward = {scrap: 16 + 8*R.sector, fuel: n.hz === "flare" ? 2 : 0, missiles: n.hz === "asteroids" ? 1 : 0};
  const pay = [`+${reward.scrap} scrap`].concat(reward.fuel ? [`+${reward.fuel} fuel`] : []).concat(reward.missiles ? [`+${reward.missiles} missile`] : []);
  sheet(`<h2>${esc(fillNames(h.title))}</h2><div class="prose">${esc(fillNames(h.text))}</div>
    <button class="choice" id="hzGo"><b>${esc(h.verb)}</b><span>Survive until the drive spools, then jump. Pays ${esc(pay.join(", "))}.</span></button>
    <button class="choice" id="hzNo"><b>Leave it alone</b><span>Nothing ventured.</span></button>`);
  $("hzGo").addEventListener("click", () => { AUDIO.sfx("click"); fightEnv(n.hz, {reward, intro:"Hold together."}); });
  $("hzNo").addEventListener("click", () => { AUDIO.sfx("click"); returnToMap(); });
}
const BOSS_LOOK = {
  fleet:{palette:{hull:"#2a2e3a",accent:"#ff3d5a",glow:"#ff5470"}, nose:"blunt", engines:4, wings:"swept", modules:["turret","turret","sensor","turret"], wear:0.55},
  swarm:{palette:{hull:"#3a2a22",accent:"#ff7a3a",glow:"#ffb35a"}, nose:"round", engines:3, wings:"delta", modules:["pod","pod","turret","pod"], wear:0.7},
  void: {palette:{hull:"#15121f",accent:"#8a5cff",glow:"#c9b8ff"}, nose:"pointed", engines:2, wings:"swept", modules:["sensor","fin","sensor","fin"], wear:0.05}
};
function fightBoss(){
  const end = ending(), p = pursuer();

    const name = String(end.name || "the end").toUpperCase();
    return fightEnv(end.env || "nova", {name, finale:true, ftlMult:0.55, intro:`${name}. ${end.what || ""}`});
  }
  const kind = MOD.bosses && MOD.bosses[p.kind] ? p.kind : "fleet";
  const b = clone(kind === "fleet" ? MOD.boss : MOD.bosses[kind]); const name = (R.arc ? R.arc.threat.flagship : "THE FLAGSHIP").toUpperCase();

  foe.art = ({fleet:"flagship", swarm:"broodmother", void:"hollow"})[kind] || "flagship"; // painted hull by kind; the name is the story's

function returnToMap(resuming){
  if (!resuming && R){ R.pendingArrive = null; R._pickApplied = false; } // the beacon's encounter is over
  closeSheet();
  if (STAGE.ok) STAGE.local = false;
  S = {mode:"map", parts:[], fx:[], floats:[], rings:[], zaps:[], warp: S && S.warp ? S.warp : 0};
  setMode("map");
  $("sector").textContent = `SECTOR ${R.sector} · ${R.arc ? R.arc.sectors[R.sector-1].name : R.you.name}`;
  AUDIO.setBattle(false);
  if (R.you.hull < R.you.maxHull*0.4) setHint("Hull critical. Hunters are drawn to weak ships.");
  buildMapDeck(); saveRun();
}

/* ---------------- after a fight ---------------- */
function afterFight(result){
  const foe = S.foe, you = R.you;
  for (const c of you.crew) if (c.hp <= 0 && !R.log.some(l => l.startsWith(c.name + " "))) R.log.push(`${c.name} died fighting the ${foe.name}.`);
  R.lost = (R.lost || []).concat(you.crew.filter(c => c.hp <= 0).map(c => c.name));
  you.crew = you.crew.filter(c => c.hp > 0);
  for (const s of Object.values(you.sys)){ s.dmg = 0; s.ion = 0; s.sab = 0; s.rep = 0; }
  // crew heal only in a medbay (FTL M1): at the beacon the wounded rest in it for a while (rules.restTime) and heal at
  // its rate (6.4 / 9.6 / 19.2 hp a second by level); no medbay, no healing. There is no free full heal.
  const bay = you.sys.medbay ? you.sys.medbay.level : 0, rest = byLevel(MOD.rules.medbayHeal, bay)*(MOD.rules.restTime || 0);
  for (const c of you.crew){ c.on = "you"; if (bay > 0 && c.hp < c.maxHp) c.hp = Math.min(c.maxHp, Math.round(c.hp + rest)); }
  you.hz = {}; you.cloakT = 0;
  AUDIO.setBattle(false);
  if (result === "dead") return gameOver(false, S.endCause === "crew" ? `the ${foe.name}` : foe.env ? String(foe.name).toLowerCase() : `the ${foe.name}`);
  R.fights++;
  if (foe.env){
    R.after = null;
    if (foe.finale) return gameOver(true);
    if (foe.reward){ const {chips} = applyEffects(foe.reward); return outcomeSheet("THROUGH IT", "The drive catches and the ship falls out of the storm with its holds full and its paint mostly gone. Somebody starts laughing on the bridge and can't stop.", chips.map(c => c.t), chips.map(c => c.good), () => returnToMap()); }
    return outcomeSheet(`CLEAR OF ${foe.name}`, "The jump takes. Behind you the beacon goes dark. Nobody says anything for a minute, and then {crew} asks who wants tea.".replace("{crew}", liveCrew()[0] ? liveCrew()[0].name : "someone"), [], [], () => returnToMap());
  }
  if (result === "win" || result === "captured"){
    R.kills++; R.rep += (foe.tier || 0) + 1;
    if (foe.boss) return gameOver(true);
    return showLoot(foe, result === "captured");
  }
  const after = R.after; R.after = null;
  if (result === "surrendered"){ const t = S.surrender || {scrap: 0}, chips = [`+${t.scrap} scrap`]; R.scrap += t.scrap; R.rep += 1;
    if (t.fuel){ R.fuel += t.fuel; chips.push(`+${t.fuel} fuel`); } if (t.missiles){ you.missiles += t.missiles; chips.push(`+${t.missiles} missile${t.missiles > 1 ? "s" : ""}`); }
    return outcomeSheet(`THE ${foe.name} SURRENDERS`, "They send the goods across and jump the moment you let them. Nobody on the bridge says it, but it beats another volley.", chips, chips.map(() => true), () => after ? after() : returnToMap()); }
  if (result === "stalemate"){ const f = MOD.rules.stalemateFuel || 0; R.fuel += f;
    return outcomeSheet(`THE ${foe.name} BREAKS OFF`, "A minute of nothing getting through on either side, and they give up and jump. They leave a drifting fuel pod behind.", f ? [`+${f} fuel`] : [], f ? [true] : [], () => after ? after() : returnToMap()); }
  if (result === "fled") return outcomeSheet(`THE ${foe.name} ESCAPED`, "Its drive flares and it is gone. Nothing to salvage but its wake.", [], [], () => after ? after() : returnToMap());
  if (result === "escaped") return outcomeSheet("JUMPED CLEAR", `You spool up and leave the ${foe.name} firing at empty space.`, [], [], () => returnToMap());
}
function showLoot(foe, captured){

    if (theirs.length){ const id = pick(theirs); picks.unshift({kind:"system", system:id, amount:1, label:`Strip their ${SYS_LABEL[id].toLowerCase()}`, detail:"a whole new system, installed where you have room", blue:true}); }

function loadRun(){ const r = lsGet("ftlr.run"); if (!r || !r.you || !r.map || r.v !== 3) return null;
  if (!runLooksSound(r)){ lsSet("ftlr.run", null); return null; } // a run saved by an older build that this one can't fly: drop it
  if (!r.you.sys.oxygen){ r.you.reactor += 1; addSystem(r.you, "oxygen", 1); } // saved before oxygen existed
  if (!r.you.size) r.you.size = shipDef(r.you.defId).size || "medium"; // saved before ship sizes
  for (const c of r.you.crew) c.species = {tinker: "human", basalt: "myrm"}[c.species] || c.species; // retired races
  return r; }
function runLooksSound(r){
  try {
    const y = r.you, ids = new Set();
    if (!Array.isArray(y.layout) || !y.layout.length || !y.sys || !Array.isArray(y.weapons) || !Array.isArray(y.crew)) return false;
    for (const q of y.layout){ if (!q || typeof q.id !== "string" || ids.has(q.id) || ![q.x, q.y, q.w, q.h].every(Number.isFinite) || q.w < 1 || q.h < 1) return false; ids.add(q.id); }
    for (const id of Object.keys(y.sys)) if (SYSTEMS.includes(id) && !ids.has(id)) return false;
    for (const w of y.weapons) if (!w || !Number.isFinite(w.cd) || !Number.isFinite(w.power)) return false;
    if (!Array.isArray(r.map.nodes) || !r.map.nodes[r.pos]) return false;
    return Number.isFinite(y.hull) && y.hull > 0 && Number.isFinite(r.sector);
  } catch { return false; }
}

function drawShipPreview(cv, def){

  }

function planetOf(seed){ return PLANET_ORDER[Math.floor(rng32(seed ^ 0xbeac0)()*PLANET_ORDER.length)]; }

function probePlanet(){
  const n = R.map.nodes[R.pos]; if (!n || n.probed) return;
  n.probed = true; AUDIO.sfx("signal");
  const kind = planetOf(n.seed), table = PROBES[kind] || PROBES["gas giant"];
  let t = Math.random()*table.reduce((a,o) => a + o.p, 0), out = table[0];
  for (const o of table){ t -= o.p; if (t <= 0){ out = o; break; } }
  if (out.site && AWAY_SITES[out.site]) return runEvent({...AWAY_SITES[out.site], art: out.site, source:"pool"});
  const {chips} = applyEffects(out.fx);
  R.log.push(`Probed the ${kind}. ${fillNames(out.text).slice(0,120)}`); R.log = R.log.slice(-14);
  outcomeSheet(`PROBE · ${kind.toUpperCase()}`, fillNames(out.text), chips.map(c => c.t), chips.map(c => c.good), () => returnToMap());
}

/* ---------------- away teams: you pick who goes down, their skills set the odds ---------------- */
const AWAY_SKILL = {combat:"combat", repair:"repair", pilot:"pilot", engines:"engines", weapons:"weapons", shields:"shields"};
function awayOdds(c, skill){
  const sp = SP(c); let p = 0.55 + 0.15*lvl(c, skill);
  if (skill === "combat") p += (sp.combat - 1)*0.35;
  if (skill === "repair") p += (sp.repair - 1)*0.18;
  if (c.bio && c.bio.trait && /reckless/.test(c.bio.trait)) p -= 0.05;
  if (c.hp < c.maxHp*0.5) p -= 0.12;
  return clamp(p, 0.1, 0.92);
}
function awayPicker(ch, done){
  const skill = AWAY_SKILL[ch.away.skill] || "combat";
  sheet(`<h3>AWAY TEAM · ${SKILL_LABEL[skill].toUpperCase()}</h3><h2>WHO GOES DOWN?</h2>
    <p>${esc(fillNames(ch.label))}</p>
    ${liveCrew().map((c,i) => `<button class="choice" data-a="${i}"><b>${esc(c.name)} · ${Math.round(awayOdds(c, skill)*100)}%</b><span>${esc(MOD.species[c.species].name)} ${esc(crewTitle(c))} · ${SKILL_LABEL[skill]} ${lvl(c, skill)} · ${Math.round(c.hp)}/${c.maxHp} hp</span></button>`).join("")}`);
  $("panel").querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => { AUDIO.sfx("click"); const c = liveCrew()[+b.dataset.a]; done(c, Math.random() < awayOdds(c, skill)); }));
}
function awayAftermath(c, out){
  const e = out.effects || {}, chips = [];
  if (e.awayXp !== false) gainXp(c, AWAY_SKILL[out._skill] || "combat", 20);
  if (typeof e.awayHurt === "number"){ c.hp = Math.max(5, c.hp - clamp(e.awayHurt, 0, 90)); chips.push({t:`${c.name} hurt`, good:false}); }
  if (e.awayLost && R.you.crew.length > 1){
    R.you.crew = R.you.crew.filter(q => q !== c); R.lost = (R.lost || []).concat(c.name);
    R.fallen = (R.fallen || []).concat({name:c.name, species:c.species, kills:c.kills || 0, past: c.bio ? c.bio.past : "", last: c.bio && c.bio.lines && c.bio.lines.last || "", foe:"the away mission", sector:R.sector, color:c.color, seed:c.seed});
    R.log.push(`${c.name} did not come back from the surface.`); chips.push({t:`${c.name} did not come back`, good:false});
  }
  return chips;
}

const epicById = id => EPICS.find(e => e.id === id);
function chooseEpic(seed){
  const recent = new Set((UNI.captains || []).slice(-8).map(c => c.epic));
  const pool = EPICS.filter(e => !recent.has(e.id));
  const r = rng32(seed);
  return rpick(r, pool.length ? pool : EPICS).id;
}
/* What chases you, and how it ends. A fleet hunts; a nova burns the lanes
   behind you; the void swallows beacons whole; a swarm eats anything warm.
   "battle" ends on a flagship. "escape" ends on a place that tries to kill
   you, and you win by getting the drive spooled and leaving. */
const F = (pursuer, pname, kind, name, what, env) => ({pursuer:{kind:pursuer, name:pname}, ending:{kind, name, what, env: env || null}});
const FATES = {

function fateOf(id){ return clone(FATES[id] || FATES.odyssey); }
function epicArc(e){ const a = clone(e.arc); a.cast = []; Object.assign(a, fateOf(e.id)); return a; }

const CODEX = `STORY RULES (follow all):
- Every voyage is built on the BONES of one great epic (given below). Transpose its structure, archetypes and central struggle into science fiction: same bones, entirely new skin. Never use its names, places, props or famous lines, and never name it. A reader who knows the epic should feel the rhyme and recognise it only near the end.
- Mythic bones, fresh skin: build on archetypes (mentor, shadow, threshold guardian, herald, trickster) and on reversal and recognition; never reuse a known story.
- Show, never sermonize. The arc secretly tests one virtue; never name it, never moralize. If a player could quote the moral, you failed.
- The fine line: the real axis is compassion vs. expedience, not good vs. evil. The expedient option is fast, frictionless and often mechanically correct; compassion costs time, scrap, hull or risk. Never make the expedient choice obviously the villain's.
- The apparently virtuous sometimes do monstrous things with clean hands. Do not resolve which. Alternate.
- No moral scoreboard and no verdict text. The consequence lands; the judgment is the player's.
- Kindness sometimes pays, unpredictably: use outcome odds so the kind road is a live gamble, not a tax.
- Earned relief exists: sometimes something good happens that is not a trick.
- The crew like each other: small, specific warmth, jokes that land. Beauty described straight.
- Every choice carries a real mechanical consequence in its effects. No choice that only changes the prose.
- The arc remembers: a choice can plant a hidden "debt" that comes due sectors later.
- Prose is the reward. Second person for the captain. 60-130 words per event text.
VOICE (the most important rule here; players can smell machine prose and it ruins the game):
- Write like the novelists people cannot put down: the dry, deadpan, funny narrator of Martha Wells; Becky Chambers' warmth for ordinary people doing their jobs; Le Guin's plainness; one surprising Bradbury image when it earns its place. Never name them.
- Concrete beats abstract. Name the object, the smell, the number on the gauge. "The coffee machine has been broken since sector two" beats "morale is low".
- People talk. Give someone a line whenever they would speak. They interrupt, understate, joke when scared, and say less than they mean.
- Vary sentence length. Fragments are fine. Use contractions.
- Understatement over melodrama. Humour is wanted, even in dark moments.
- Never tell the reader what anyone feels ("fear grips you", "a sense of dread"). Show what they do.
- Banned outright: em dashes; "not X, but Y" and "it's not just X, it's Y"; lists of three adjectives or three parallel clauses; ending on a moral, a rhetorical question, or a summary of the mood; these words: tapestry, testament, echo of, whispers, resonate, palpable, profound, ethereal, liminal, symphony, dance of, the weight of, a reminder that, vastness, stark, eerie, unspoken, delve, navigate (unless literal), journey (as a metaphor), realm, beacon of hope.
- End on an action, an image, or a line of dialogue. Stop one sentence earlier than feels natural.`;

Objects: crew: {} or {"name":"...","bonus":"pilot|engines|repair|combat|weapons|none"} adds a crew member; crewLose: true or "<crew name>" removes one; sysDamage: {"system":"shields|engines|weapons|medbay|pilot","amount":1-3} (damaged at the start of the next fight); weapon: "random" or an id from WEAPONS; system: "cloak|drones|tele"; drone: "defense|combat"; fight: {"tier":0-3,"name":"SHIP NAME"} (a fight follows the text); store: true; debt: {"tag":"short-id","text":"what will come due, one sentence"} (hidden from the player).

    return {label:c.label.slice(0,90), req, away, outcomes:outs};

  if (choices.length < 2 || choices.every(c => c.req)) return null;
  return {title:ev.title.slice(0,60), text:ev.text.slice(0,1400), choices, source:"claude"};

    for (const [id,w] of Object.entries(m.weapons)){
      if (!["laser","missile","ion","beam"].includes(w.type)) return `weapon ${id} has unknown type ${w.type}`;
      for (const f of ["shots","dmg","cd","power"]) if (typeof w[f] !== "number" || w[f] < 0) return `weapon ${id}.${f} must be a number`;
      if (w.cd <= 0) return `weapon ${id}.cd must be above 0`;
    }
    const p = m.player;
    if (!(p.hull > 0) || !(p.reactor >= 0)) return "player hull/reactor";
    if (!Array.isArray(p.weapons) || p.weapons.some(id => !m.weapons[id])) return "player has an unknown weapon id";
    if (!Array.isArray(p.layout) || !p.layout.length) return "player layout";

    play("debris", t + 0.5, {rate: 0.85, gain: 0.4, pan, must: true}); play("debris", t + 1.1, {rate: 1.1, gain: 0.25, pan: -pan, must: true});
    noise(t, 2.4, 0.18, {type: "lowpass", f: 900, to: 90, must: true});
  }
  function crewDeath(){ // a crew member dies: a heavy blow, a falling tone, a low bell
    if (!ok("death", 0.4)) return;
    const t = ctx.currentTime;
    play("punch2", t, {rate: 0.7, gain: 0.4});
    tone("sine", 660, t + 0.05, 0.55, 0.06, {to: 160, glide: 0.5, r: 0.2});
    tone("sine", 220, t + 0.2, 1.4, 0.06, {fm: [3.5, 1.4, 0.05, 0.4], decay: 1.8, verb: 0.6});
    tone("sine", 233, t + 0.2, 1.4, 0.03, {decay: 1.6});
  }
  function zap(){ // a defence drone shoots a missile down
    if (!ok("zap", 0.08)) return;
    const t = ctx.currentTime;
    play("laser3", t, {rate: rr(1.4, 1.6), gain: 0.6, pan: -0.22}); play("bang3", t + 0.06, {rate: 1.6, gain: 0.5, pan: 0.1, hp: 800});
  }
  // interface
  function ui(kind){
    if (!ok("ui:" + kind, 0.04)) return;
    const t = ctx.currentTime;
    switch (kind){
      case "tap": play("tap", t, {rate: rr(0.98, 1.06), gain: 0.32, hp: 400}); break;
      case "confirm": play("confirm", t, {gain: 0.32}); play("tap", t, {rate: 1.5, gain: 0.12}); break;
      case "deny": play("deny", t, {gain: 0.28, jit: 0}); break;
      case "target": play("tap", t, {rate: 1.35, gain: 0.26}); tone("sine", 1760, t + 0.04, 0.06, 0.035, {r: 0.05}); tone("sine", 2349, t + 0.1, 0.08, 0.03, {r: 0.08}); break;
      case "power+": play("switch", t, {rate: 1.12, gain: 0.3, jit: 0}); tone("sine", 660, t, 0.06, 0.04, {to: 990}); break;
      case "power-": play("switch", t, {rate: 0.86, gain: 0.3, jit: 0}); tone("sine", 660, t, 0.06, 0.035, {to: 440}); break;
      case "buy": play("coins", t, {gain: 0.42}); play("confirm", t + 0.05, {gain: 0.2, rate: 1.06}); break;
      case "upgrade": play("confirm", t, {gain: 0.25, rate: 1.12}); [587, 740, 880, 1175].forEach((f, i) => tone("sine", f, t + 0.05 + i*0.06, 0.18, 0.045, {fm: [2, 0.8, 0.1, 0.1], decay: 0.35, verb: 0.2})); break;
      case "levelup": [587, 740, 880].forEach((f, i) => tone("sine", f*2, t + i*0.09, 0.3, 0.075, {fm: [3.5, 1, 0.05, 0.2], decay: 0.6, verb: 0.3})); break;
      case "text": for (let i = 0; i < 7; i++) play("tick", t + i*rr(0.04, 0.07) + i*0.01, {rate: rr(0.85, 1.35), gain: rr(0.2, 0.3), jit: 0}); break;
      case "fixed": tone("sine", 1175, t, 0.12, 0.07, {fm: [2, 0.5, 0.05, 0.1], decay: 0.25}); tone("sine", 1568, t + 0.08, 0.16, 0.07, {fm: [2, 0.5, 0.05, 0.1], decay: 0.35}); play("latch", t, {gain: 0.16}); break;
      case "signal": tone("sine", 880, t, 0.4, 0.09, {fm: [3, 0.6, 0.05, 0.2], decay: 0.6, verb: 0.35}); tone("sine", 1318, t + 0.16, 0.5, 0.08, {fm: [3, 0.6, 0.05, 0.2], decay: 0.8, verb: 0.35, pan: 0.2}); break;
    }
  }
  /* ---------------- the old names (sfx("laser") etc.) ---------------- */
  function sfx(name, vol = 1){
    try {
      if (!ctx || mode === 2 || ctx.state !== "running") return;
      const you = typeof S !== "undefined" && S ? S.you : null, foe = typeof S !== "undefined" && S ? S.foe : null;
      switch (name){
        case "laser": return weapon({type: "laser", shots: 1, dmg: 1, id: "drone"}, you);
        case "missile": case "beam": case "ion": return weapon({type: name, shots: 1, dmg: 1}, you);
        case "shield": return shield(you);
        case "hit": return hit(you, Math.round(vol*4));
        case "boom": return explosion(foe);
        case "death": return crewDeath();
        case "zap": return zap();
        case "click": return ui("tap");
        case "buy": return ui("buy");
        case "jump": return jump();
        case "teleport": return teleport();
        case "cloak": return cloak();
        case "alarm": return alarm();
        case "signal": return ui("signal");
        case "win": return sting("win");
        default: return ui(name);
      }
    } catch {}
  }
  /* ---------------- a stand-in score, only if the music files cannot load ---------------- */
  function fallbackScore(){
    const SPB = 60/96/4, PROGS = [[57,0],[53,1],[48,1],[55,1]], mtof = m => 440*Math.pow(2, (m - 69)/12);
    const ex = ctx.createGain(), ba = ctx.createGain(); ex.connect(stemGain.explore); ba.connect(stemGain.battle);
    stemGain.explore.gain.setTargetAtTime(1, ctx.currentTime, 0.5); ba.gain.value = 0;
    let step = 0, nextT = ctx.currentTime + 0.1, on = false;
    return {
      battle(v, t){ on = v; ba.gain.setTargetAtTime(v ? 1 : 0, t, v ? 0.4 : 1.2); },
      tick(){
        if (ctx.state !== "running" || mode !== 0) { nextT = ctx.currentTime + 0.1; return; }
        while (nextT < ctx.currentTime + 0.2){
          const [root, maj] = PROGS[Math.floor(step/16) % 4], s = step % 16, tn = [root, root + (maj ? 4 : 3), root + 7, root + 12], t = nextT;
          if (s === 0){ for (const n of tn.slice(0, 3)) tone("sawtooth", mtof(n + 12), t, SPB*15, 0.02, {a: 1, r: 1.2, lp: 900, dest: ex}); tone("sine", mtof(root - 12), t, SPB*15, 0.12, {a: 0.08, r: 0.5, dest: ex}); }
          if (s % 2 === 0){ const pat = [0,1,2,1,2,3,2,1]; tone("triangle", mtof(tn[pat[(s/2) % 8]] + 12), t, SPB*1.4, 0.045, {r: 0.3, dest: ex}); }
          if (on){ if (s === 0 || s === 8) tone("sine", 150, t, 0.22, 0.45, {to: 42, glide: 0.14, dest: ba}); if (s === 4 || s === 12) noise(t, 0.16, 0.2, {type: "bandpass", f: 1900, q: 0.7, dest: ba});
            if ([0,2,3,6,8,10,11,14].includes(s)) tone("sawtooth", mtof(root - 12), t, SPB*1.5, 0.1, {lp: 400, dest: ba}); }
          step = (step + 1) % 64; nextT += SPB;
        }
      }
    };
  }
  /* ---------------- wiring ---------------- */
  document.addEventListener("visibilitychange", () => { if (!ctx) return; if (document.hidden) ctx.suspend(); else ctx.resume(); });
  // iOS only lets audio start inside a user gesture: the very first tap anywhere starts it
  for (const ev of ["pointerdown", "touchend", "click", "keydown"]) addEventListener(ev, () => { if (!ctx || ctx.state !== "running") unlock(); }, {capture: true, passive: true});
  const btn = document.getElementById("sndBtn");
  if (btn){ btn.textContent = label();
    btn.addEventListener("click", () => { unlock(); mode = (mode + 1) % 3; try { localStorage.setItem("ftlr.snd", String(mode)); } catch {} applyMode(); ui("tap"); }); }
  const safe = fn => (...a) => { try { return fn(...a); } catch {} };
  return {unlock, sfx: safe(sfx), setBattle: safe(setBattle), sting: safe(sting), weapon: safe(weapon), hit: safe(hit), miss: safe(miss), shield: safe(shield),
    sysDamage: safe(sysDamage), ignite: safe(ignite), frame: safe(frame), crew: safe(crew), door: safe(door), doorBreak: safe(doorBreak), ui: safe(ui), explosion: safe(explosion),
    teleport: safe(teleport), cloak: safe(cloak), jump: safe(jump), crewDeath: safe(crewDeath), alarm: safe(alarm), zap: safe(zap),
    get ctx(){ return ctx; }, get state(){ return {mode, music: musicState, battle: battleOn, voices, samples: Object.keys(buf).length}; }};
})();

/* SOUND lives in src/audio.js (AUDIO). */
/* ============================================================
   BOOT
   ============================================================ */
async function initClaude(){
  if (!window.claude || !window.claude.use) return;
  try { db = await window.claude.use("db"); } catch { db = null; }
  try { sample = await window.claude.use("sample"); } catch { sample = null; }
  if (sample) $("aiBtn").hidden = false;
  if (db){
    try {
      const snap = await db.doc(MOD_DOC).get();
      if (snap.exists){
        const d = snap.data();
        modHistory = Array.isArray(d.history) ? d.history : [];
        modStack = (Array.isArray(d.stack) ? d.stack : []).map(migrateMod).filter(m => m && m.version === DEFAULT_MOD.version);
        const m = migrateMod(d.mod);
        if (m && m.version === DEFAULT_MOD.version && validate(m) === true) MOD = m;
      }
    } catch {}
  }
  await loadUniverse();
  if (S && S.mode === "title") showTitle();
}
/* ---------------- 3D on or off, errors, and the #debug strip ----------------
   On a real phone the 3D stage can fail or lose its context. Then the 2D renderer carries on, and a
   small note says why. Errors show on screen instead of failing silently; #debug adds a live readout. */
function set3D(on, why){
  STAGE.ok = !!on; if (!on) STAGE.why = why || STAGE.why || "off";
  $("bg").hidden = !!on; $("gl").style.visibility = on ? "" : "hidden"; $("viewBtn").hidden = !on;
  const n = $("glNote"); n.hidden = !!on || !!STAGE.flat; n.textContent = on ? "" : `3D off: ${STAGE.why}`;
  if (!on){ TS = 1; if (S && S.mode === "fight") layout(); }
}
let lastError = "", oopsT = 0;
function reportError(e){
  const msg = String(e && (e.message || e.reason && e.reason.message) || e || "unknown").slice(0, 140); lastError = msg;
  const el = $("oops"); if (!el) return; el.textContent = `Something broke: ${msg}`; el.hidden = false;
  clearTimeout(oopsT); oopsT = setTimeout(() => el.hidden = true, 6000);
}
addEventListener("error", e => reportError(e.error || e.message));
addEventListener("unhandledrejection", e => reportError(e.reason || "a promise failed"));
const DIAG = {on: hashFlag("debug"), n: 0, t0: 0, fps: 0, el: null,
  tick(now){
    if (!this.on) return;
    this.n++; if (now - this.t0 < 500) return;
    this.fps = Math.round(this.n*1000/(now - this.t0)); this.n = 0; this.t0 = now;
    if (!this.el){ this.el = document.createElement("div"); this.el.id = "diag"; document.body.appendChild(this.el); }
    const i = STAGE.ok && STAGE.info ? STAGE.info() : null, ua = navigator.userAgent.match(/(iPhone|iPad|Android|Mac OS X|Windows)[^;)]*/);
    this.el.textContent = `3D ${STAGE.ok ? "on" : "off (" + (STAGE.why || "?") + ")"} · dpr ${devicePixelRatio} · 2D ${cv.width}x${cv.height}` + (i ? ` · gl ${i.w}x${i.h}@${i.dpr} ${i.calls} calls ${Math.round(i.tris/1000)}k tris` : "") +
      ` · ${this.fps} fps · ${S ? S.mode : "-"}${ua ? " · " + ua[0] : ""}` + (lastError ? `\nlast error: ${lastError}` : "");
  }
};
addEventListener("hashchange", () => { DIAG.on = hashFlag("debug"); if (!DIAG.on && DIAG.el){ DIAG.el.remove(); DIAG.el = null; } });
function boot(data){
  set3D(STAGE.ok, STAGE.why);
  loadArt();
  resize();
  addEventListener("resize", resize);
  new ResizeObserver(resize).observe($("field"));
  S = {mode:"title", parts:[], fx:[], floats:[], rings:[], zaps:[], warp:0};
  setMode("title");
  requestAnimationFrame(frame);
  const hot = data && data.run;
  if (hot && hot.you && hot.map){ R = hot; returnToMap(); } else showTitle();
  initClaude();
}
/* camera: B three-quarter (default), A top-down, C cinematic (pauses the fight, like a photo mode) */
const VIEW_LABEL = {three:"VIEW B", top:"VIEW A", cine:"VIEW C"};
function syncViewBtn(){ if (STAGE.ok) $("viewBtn").textContent = VIEW_LABEL[STAGE.view()] || "VIEW"; }
$("viewBtn").addEventListener("click", () => {
  if (!STAGE.ok) return;
  AUDIO.sfx("click");
  const next = ({three:"top", top:"cine", cine:"three"})[STAGE.view()] || "three";
  STAGE.view(next); syncViewBtn();
  if (S && S.mode === "fight" && !S.over){
    if (next === "cine"){ S.wasPaused = S.paused; S.paused = true; setHint("Cinematic view. The fight waits for you. Tap VIEW to go back."); }
    else if (next === "three"){ S.paused = !!S.wasPaused; setHint(""); }

  }
});
if (STAGE.ok) syncViewBtn();
try { window.claude?.hot?.snapshot?.(() => ({run: R && S && (S.mode === "map") ? JSON.parse(JSON.stringify({...R, curEvent:null, after:null})) : null})); } catch {}
try { window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {}); } catch (e) { boot({}); }
