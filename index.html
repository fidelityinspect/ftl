<!doctype html><html lang=en><head><meta charset=utf-8><title>FTL: Redux</title><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name=apple-mobile-web-app-capable content=yes><meta name=mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-status-bar-style content=black-translucent><meta name=apple-mobile-web-app-title content="FTL Redux"><meta name=theme-color content="#06080f"><link rel=manifest href=manifest.webmanifest><link rel=apple-touch-icon href=apple-touch-icon.png><link rel=icon href=icon-192.png><style>html,body{margin:0;background:#06080f;overscroll-behavior:none;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>FTL: Redux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* One deliberate look: a ship's console in deep space. Dark by design, painted explicitly. */
:root{
  color-scheme:dark;
  --void:#06080f; --hull:#151d2b; --floor:#223047; --floor-hi:#2d3f5c; --line:#3a4c6b;
  --ink:#d9e2f2; --dim:#8394b3; --faint:#4d5d7a;
  --you:#5fd4e8; --foe:#ff6b4a; --power:#7cf29a; --warn:#ffc857; --ion:#9d8cff; --threat:#ff3d5a;
  --display:"Chakra Petch","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--void);color:var(--ink);overflow:hidden}
body{margin:0;font:13px/1.35 var(--mono);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
button:disabled{cursor:default}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:8px 16px 6px;font-family:var(--display);letter-spacing:.08em}
.brand{font-weight:700;font-size:15px;color:var(--ink);white-space:nowrap}
.brand i{font-style:normal;color:var(--you)}
.sector{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .grow{flex:1}
/* thumb reach: the view, sound and AI buttons live low on the right of the play area, 48px tall */
.fieldBtns{position:absolute;left:6px;top:44px;display:flex;flex-direction:column;align-items:stretch;gap:6px;z-index:2}
.fieldBtns .topBtn{min-height:40px;min-width:52px;font-size:10px;padding:4px 8px}
.topBtn{min-height:48px;min-width:64px;background:rgba(13,20,32,.82);font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.1em;padding:6px 10px;border:1px solid var(--line);border-radius:6px;color:var(--dim);white-space:nowrap}
.topBtn.ai{color:var(--you)}

/* battlefield */
.field{position:relative;flex:1;min-height:0;overflow:hidden}
.field canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bg{opacity:.9}
/* the fight's controls take at most 45% of the screen and scroll inside, so the ships get the rest (Michael, 2026-10-03: "it's too small the spaces") */
#deckFight{position:relative;max-height:38vh;overflow-y:auto;overscroll-behavior:contain}

/* nothing sits over the ships: RESUME heads the controls, VIEW and SOUND are small buttons in the top bar */
.top .topBtn{min-height:34px;min-width:0;padding:4px 8px;font-size:9.5px}
.actRow{display:flex;gap:6px;align-items:flex-start}.actRow .acts{flex:1;min-width:0}.actRow .go{flex:0 0 auto;min-width:112px;min-height:44px;font-size:12px;letter-spacing:.12em;padding:8px 10px}
.coach{position:absolute;left:10px;right:10px;top:6px;z-index:3;background:rgba(10,15,24,.95);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;display:grid;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.coach[hidden]{display:none}
.coach.coachTop{top:8px;bottom:auto}
.dim{color:var(--dim)}
.linkBtn{background:none;border:0;color:var(--you);text-decoration:underline;font:inherit;padding:0 4px;min-height:48px;cursor:pointer}
.coach p{margin:0;font:600 14px/1.35 var(--display);letter-spacing:.02em;color:var(--ink)}
.coachBtns{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.coachBtns button{min-height:48px}
.glNote{position:absolute;left:10px;top:8px;z-index:3;font:500 10px var(--mono);color:var(--warn);background:rgba(10,15,24,.85);border:1px solid rgba(255,200,87,.4);border-radius:4px;padding:3px 7px;pointer-events:none}
.glNote[hidden]{display:none}
.deckTabs{position:absolute;left:10px;bottom:30px;z-index:2;display:flex;gap:6px}
.deckTabs[hidden]{display:none}
.deckTabs button{position:relative;min-width:56px;min-height:48px;display:grid;place-items:center;line-height:1.1;border:1px solid var(--line);border-radius:6px;background:rgba(13,20,32,.85);color:var(--dim);font-family:var(--display)}
.deckTabs button b{font-size:16px;color:var(--ink)}
.deckTabs button span{font-size:9px;letter-spacing:.06em}
.deckTabs button.on{border-color:var(--warn)}
.deckTabs i{position:absolute;top:-8px;right:-6px;font:700 10px/1 var(--mono);font-style:normal;padding:3px 5px;border-radius:9px;color:#fff;box-shadow:0 0 0 2px var(--void)}
.deckTabs i.b{background:var(--foe)}
.deckTabs i.f{background:#c86a2a}
.deckTabs i.h{background:#8a6a4a}
#diag{position:fixed;left:0;right:0;top:0;z-index:50;font:500 10px/1.35 var(--mono);color:#cfe;background:rgba(0,0,0,.8);padding:calc(env(safe-area-inset-top,0px) + 2px) 8px 3px;pointer-events:none;white-space:pre-wrap}
#oops{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;font:600 12px/1.4 var(--mono);color:#fff;background:#5a1f1a;border:1px solid var(--foe);border-radius:8px;padding:10px 12px}
#oops[hidden]{display:none}
.hint{position:absolute;left:16px;right:16px;bottom:4px;text-align:center;color:var(--dim);font-size:11px;line-height:1.35;pointer-events:none;text-shadow:0 1px 2px #000;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;font-family:var(--display);font-weight:700;letter-spacing:.35em;font-size:clamp(18px,5vw,30px);color:var(--ink);text-shadow:0 0 18px rgba(95,212,232,.5);opacity:0;transition:opacity .5s}
.banner small{display:block;font-size:11px;letter-spacing:.25em;color:var(--dim);margin-top:6px}
.banner.on{opacity:1}

/* deck */
.deck{padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;border-top:1px solid var(--line);background:linear-gradient(#0b1019,#080b12)}
.rowLabel{font-family:var(--display);font-size:10px;letter-spacing:.18em;color:var(--faint);margin-bottom:4px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.weps{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.wep{position:relative;text-align:left;border:1px solid var(--line);border-radius:6px;padding:6px 8px 8px;background:var(--hull);overflow:hidden;min-height:48px}
.wep .nm{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.04em;display:flex;justify-content:space-between;gap:6px}
.wep .sub{font-size:10px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wep .chg{position:absolute;left:0;bottom:0;height:3px;background:var(--faint);width:0}
.wep.on .chg{background:var(--power)}
.wep.ready .chg{background:var(--warn)}
.wep.off{opacity:.55}
.wep.sel{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
.pw{display:inline-flex;gap:2px;align-items:flex-end}
.pw b{width:4px;height:12px;background:var(--faint);border-radius:1px}
.pw b.on{background:var(--power)}
.pw b.dmg{background:var(--foe)}
.pw b.ion{background:var(--ion)}
.sys{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--hull)}
.sys .lbl{font-family:var(--display);font-size:11px;letter-spacing:.08em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#systems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sys button{width:46px;height:48px;flex:none;border-radius:4px;border:1px solid var(--line);font-size:15px;line-height:1;color:var(--ink)}
.reactor{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
.crewRow{display:flex;gap:6px;flex-wrap:wrap}
.crew{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:14px;padding:4px 10px 4px 6px;background:var(--hull);font-size:11px}
.crew .dot{width:12px;height:12px;border-radius:50%}
.crew.sel{border-color:var(--warn)}
.crew small{color:var(--dim)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{min-height:48px}
.act{flex:1 1 90px;position:relative;overflow:hidden;font-family:var(--display);font-weight:600;letter-spacing:.12em;font-size:11px;padding:9px 8px;border-radius:6px;border:1px solid var(--line);background:var(--hull);color:var(--ink)}
.act .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--you);width:0}
.act:disabled{opacity:.45}
.act.armed{border-color:var(--warn);color:var(--warn)}
.go{min-height:48px;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:14px;padding:11px;border-radius:6px;background:var(--warn);color:#1a1405}
.go.running{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.go:disabled{opacity:.4}

/* map deck */
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.stats b{font-family:var(--display);font-size:13px;color:var(--ink);font-weight:600;letter-spacing:.04em}
.stats .warn b{color:var(--foe)}
.card{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--hull);display:grid;gap:3px;min-height:44px}
.card b{font-family:var(--display);font-size:13px;letter-spacing:.08em}
.card span{color:var(--dim);font-size:11px}
.card .tag{display:inline-block;font-family:var(--display);font-size:10px;letter-spacing:.14em;padding:1px 6px;border-radius:3px;border:1px solid currentColor;margin-right:6px}
.btn2{display:flex;gap:8px}
.btn2 > *{flex:1}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(3,5,10,.72);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding-inline:16px}
.panel{width:100%;max-width:540px;background:#0d1420;border:1px solid var(--line);border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:88%;overflow:auto;user-select:text;-webkit-user-select:text}
.panel h2{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.12em;font-size:16px;text-wrap:balance}
.panel h3{margin:4px 0 0;font-family:var(--display);font-weight:600;letter-spacing:.16em;font-size:11px;color:var(--faint)}
.panel p{margin:0;color:var(--dim)}
.panel .prose{color:var(--ink);font-size:13.5px;line-height:1.6;white-space:pre-wrap;max-width:62ch}
.choice{display:grid;gap:2px;text-align:left;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--hull)}
.choice b{font-family:var(--display);font-size:13px;letter-spacing:.05em}
.choice span{color:var(--dim);font-size:11px}
.choice.blue b{color:var(--you)}
.choice:disabled{opacity:.4}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--display);font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:12px;border:1px solid var(--line)}
.chip.good{color:var(--power);border-color:rgba(124,242,154,.4)}
.chip.bad{color:var(--foe);border-color:rgba(255,107,74,.4)}
textarea{width:100%;box-sizing:border-box;min-height:74px;background:var(--void);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.4 var(--mono);resize:vertical}
.btnRow{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:48px;font-family:var(--display);font-weight:600;letter-spacing:.1em;font-size:12px;padding:9px 12px;border-radius:6px;border:1px solid var(--line)}
.btn.primary{background:var(--you);color:#04161a;border-color:var(--you)}
.btn:disabled{opacity:.45}
.aiOut{white-space:pre-wrap;font-size:12px;color:var(--ink);background:var(--void);border-radius:8px;padding:10px;border:1px dashed var(--line)}
.log{font-size:11px;color:var(--dim);display:grid;gap:4px}
.examples{display:flex;gap:6px;flex-wrap:wrap}
.examples button{font-size:11px;border:1px solid var(--line);border-radius:12px;padding:4px 9px;color:var(--dim)}
.shop{display:grid;gap:6px}
.shop .choice{grid-template-columns:1fr auto;align-items:center}
.shop .price{font-family:var(--display);color:var(--warn);font-size:13px}
.upg{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;font-size:12px}
.upg .nm{font-family:var(--display);letter-spacing:.08em}
.title{font-family:var(--display);font-weight:700;letter-spacing:.3em;font-size:28px;margin:0}
.title i{font-style:normal;color:var(--you)}
.hall{display:grid;gap:6px;font-size:11px;color:var(--dim)}
.hall div b{color:var(--ink);font-family:var(--display);letter-spacing:.06em}
.thinking{color:var(--faint);font-size:11px;letter-spacing:.1em}
.bones{display:grid;gap:3px;border-top:1px solid var(--line);padding-top:10px}
.bones b{font-family:var(--display);font-size:15px;letter-spacing:.06em;color:var(--warn)}
.bones span{font-size:11px;color:var(--faint);letter-spacing:.08em}
.wep.t-laser{border-left:3px solid #5fd4e8}.wep.t-missile{border-left:3px solid #ffc857}.wep.t-beam{border-left:3px solid #ff6ec8}.wep.t-ion{border-left:3px solid #9d8cff}
.crewRow{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.crewCard{min-height:48px;display:flex;gap:6px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:8px;padding:3px 6px 3px 3px;background:var(--hull);min-width:0}
.crewCard img{width:34px;height:34px;border-radius:5px;image-rendering:pixelated;flex:none}
.crewCard .cc{display:grid;gap:2px;min-width:0;flex:1}
.crewCard b{font-family:var(--display);font-size:12px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crewCard small{font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crewCard .hpb{height:3px;background:#26324a;border-radius:2px;overflow:hidden}.crewCard .hpb i{display:block;height:100%;width:100%;background:var(--power)}
.crewCard.sel{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}.crewCard.dead{opacity:.35}
#eulogy{position:absolute;left:50%;top:12px;transform:translate(-50%,-8px);display:flex;gap:10px;align-items:center;width:max-content;max-width:min(92%,440px);background:rgba(8,11,18,.95);border:1px solid var(--foe);border-radius:10px;padding:8px 12px 8px 8px;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;z-index:5}
#eulogy.on{opacity:1;transform:translate(-50%,0)}#eulogy img{width:52px;height:52px;image-rendering:pixelated;border-radius:6px;flex:none}
#eulogy b{display:block;font-family:var(--display);letter-spacing:.14em;color:var(--foe);font-size:14px}#eulogy span{display:block;font-size:10.5px;color:var(--dim)}#eulogy i{display:block;font-style:italic;color:var(--ink);margin-top:3px}
.roster{display:grid;gap:8px}
.rcard{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--hull)}
.evArt{display:block;width:100%;aspect-ratio:2/1;object-fit:cover;image-rendering:pixelated;border-radius:8px;margin-bottom:10px;border:1px solid var(--line)}
.rcard img{width:52px;height:52px;border-radius:6px;image-rendering:pixelated;flex:none}
.rcard > div{display:grid;gap:3px;min-width:0}
.rcard b{font-family:var(--display);letter-spacing:.06em}.rcard .sub{font-size:11px;color:var(--dim)}.rcard .bio{font-size:11.5px;color:var(--ink)}
.rcard .skills{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}.rcard .skills span{white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
/* skill level pips: two separate squares (the ●○ glyphs ran together like an infinity sign in some fonts) */
.skDot{display:inline-block;width:7px;height:7px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(160,200,220,.55)}.skDot.on{background:var(--power,#7cf29a);box-shadow:0 0 4px rgba(124,242,154,.5)}
.skDot:first-of-type{margin-left:2px}
.wlist{display:grid;gap:6px}.wrow{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--hull)}
.wrow > div{display:grid;gap:2px;min-width:0}.wrow b{font-family:var(--display);letter-spacing:.05em;font-size:13px}.wrow span{font-size:10.5px;color:var(--dim)}
.wrow.t-laser{border-left:3px solid #5fd4e8}.wrow.t-missile{border-left:3px solid #ffc857}.wrow.t-beam{border-left:3px solid #ff6ec8}.wrow.t-ion{border-left:3px solid #9d8cff}
.ships{display:grid;gap:8px}
.hangar{display:grid;gap:10px}
.panel:has(.hangar){max-height:96%;align-content:start}
.hgTop{display:flex;justify-content:space-between;font-family:var(--display);font-size:11px;letter-spacing:.14em;color:var(--dim)}
.hgName{margin:0;font-family:var(--display);font-size:30px;letter-spacing:.16em;line-height:1}
.hgStage{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:4px}
.hgStage canvas{display:block;width:100%;touch-action:pan-y;background:radial-gradient(ellipse at 50% 55%,rgba(95,212,232,.10),transparent 70%);border-radius:10px}
.hgArrow{min-height:64px;border:1px solid var(--line);border-radius:8px;color:var(--you);font-size:18px;background:rgba(13,20,32,.6)}
.hgArrow:disabled{opacity:.3}
.hgDots{display:flex;justify-content:center;gap:6px}.hgDots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.hgDots i.on{background:var(--you)}
.hgBlurb{margin:0;color:var(--dim);font-size:13px}
.hgStats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hgStats div{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;background:var(--hull)}
.hgStats b{display:block;font-family:var(--display);font-size:20px;color:var(--ink)}.hgStats span{font-size:9.5px;letter-spacing:.12em;color:var(--dim)}
.hgGuns{display:flex;flex-wrap:wrap;gap:6px}
.hgGuns span{display:grid;border:1px solid var(--line);border-left:3px solid var(--you);border-radius:6px;padding:4px 8px;background:var(--hull);min-width:0}
.hgGuns span.t-missile{border-left-color:var(--warn)}.hgGuns span.t-beam{border-left-color:var(--foe)}.hgGuns span.t-ion{border-left-color:var(--ion)}.hgGuns span.hgSys{border-left-color:var(--power);grid-template-columns:1fr}
.hgGuns b{font-size:12px}.hgGuns small{font-size:10px;color:var(--dim)}
.hgCrew{display:flex;gap:10px;flex-wrap:wrap}
.hgCrew span{display:grid;justify-items:center;gap:1px;width:64px}.hgCrew img{width:44px;height:44px;image-rendering:pixelated;border-radius:6px;border:1px solid var(--line)}
.hgCrew b{font-size:11px}.hgCrew small{font-size:9.5px;color:var(--dim)}
.hgBtns{justify-content:space-between}.hgBtns .primary,.hgBtns .go{flex:1}
.shipPick{display:grid;gap:3px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px;background:var(--hull)}
.shipPick canvas{display:block;width:100%;max-width:300px;height:auto;aspect-ratio:5/2;justify-self:center}
.shipPick b{font-family:var(--display);letter-spacing:.1em;font-size:15px}.shipPick b span{font-size:11px;color:var(--dim);letter-spacing:.08em;margin-left:6px}
.shipPick > span{font-size:11.5px;color:var(--dim)}.shipPick .stats{font-size:10.5px;color:var(--faint)}
@media (max-width:460px){ #systems{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:760px){ .deck{grid-template-columns:1.4fr 1fr;align-items:start} .deck .full{grid-column:1/-1} }
@media (prefers-reduced-motion:reduce){ .banner{transition:none} }

/* ===== Landscape (Michael, 2026-10-03: "update the whole game as a landscape game from these mockups").
   The battle fills the screen; the controls float over it like the concept art: systems down the left
   (swipe up for power, down to take it away), round weapon buttons bottom right (tap then tap a room, or drag
   onto the room), crew portraits along the bottom, VENT / JUMP / PAUSE top right, resources in the top bar. */
.hudRes{display:none;gap:12px;font-family:var(--display);font-size:11px;letter-spacing:.08em;color:var(--dim);white-space:nowrap}
.hudRes b{color:var(--ink);font-weight:600}.hudRes .lo b{color:var(--foe)}
body.land .top{padding:2px 10px;gap:12px}body.land .brand{display:none}body.land .top .topBtn{min-height:26px;padding:2px 8px}
body.land .hudRes{display:flex}
body.land #app{position:relative;max-width:none}
body.land #deckFight{position:absolute;top:30px;left:0;right:0;bottom:0;max-height:none;overflow:visible;background:none;border:0;padding:0;display:block;pointer-events:none}
body.land #deckFight[hidden]{display:none}
body.land #deckFight > *{pointer-events:auto}
body.land #deckFight .rowLabel{display:none}
body.land .actRow{position:absolute;top:4px;right:6px;display:flex;gap:6px;align-items:center}
body.land .actRow .acts{display:flex;gap:6px;flex-wrap:nowrap}
body.land .actRow .act{flex:none;min-height:30px;padding:4px 9px;font-size:10px;background:rgba(13,20,32,.88)}
body.land .actRow .go{min-width:88px;min-height:30px;font-size:11px;padding:4px 9px}
body.land #sysBox{position:absolute;left:6px;top:4px;width:136px;max-height:calc(100% - 112px);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:3px}
body.land #sysBox .rowLabel{display:flex!important;font-size:8.5px;margin:0 0 1px;white-space:nowrap}
body.land #systems{display:flex;flex-direction:column;gap:4px}
body.land .sys{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 8px;height:28px;min-height:0;box-sizing:border-box;background:rgba(13,20,32,.88);border-color:rgba(127,216,255,.35);touch-action:none;cursor:ns-resize}
body.land .sys button{display:none}
body.land .sys .lbl{font-size:10px}
body.land #wepBox{position:absolute;right:6px;bottom:6px;width:150px}
body.land .weps{grid-template-columns:repeat(2,68px);gap:6px;justify-content:end}
body.land .wep{width:68px;height:68px;border-radius:50%;padding:0;display:grid;place-items:center;text-align:center;background:rgba(13,20,32,.9);border:2px solid var(--line);touch-action:none}
body.land .wep::before{content:"";position:absolute;inset:3px;border-radius:50%;background:conic-gradient(var(--ring,#ffc857) calc(var(--p,0)*1turn), transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
body.land .wep .nm{flex-direction:column;align-items:center;gap:1px;font-size:9px;line-height:1.05;padding:0 10px}
body.land .wep .sub{font-size:7.5px;white-space:normal;max-width:54px;text-align:center}
body.land .wep .chg{display:none}
body.land .wep.off{opacity:.55}body.land .wep.ready{border-color:var(--power)}body.land .wep.sel{border-color:var(--warn);box-shadow:0 0 12px rgba(255,200,87,.45)}
body.land #crewBox{position:absolute;left:6px;bottom:6px;width:136px}
body.land .crewRow{display:flex!important;gap:4px;justify-content:flex-start;flex-wrap:wrap}
body.land .crewCard{flex-direction:column;gap:1px;padding:2px;min-height:0;width:42px;background:rgba(13,20,32,.88);border-radius:12px}
body.land .crewCard img{width:36px;height:36px;border-radius:50%}
body.land .crewCard .cc{width:100%}body.land .crewCard .cc b{font-size:8.5px;text-align:center}body.land .crewCard small{display:none}
body.land .hint{top:auto;bottom:4px;left:150px;right:160px;text-align:center;font-size:10px}
body.land .coach{position:absolute;top:52px;left:22%;right:22%;margin:0;box-sizing:border-box} /* left, width, top/bottom are set by coachPlace() (p4.js) so a tip never covers its subject */
body.land #deckMap{position:absolute;top:36px;right:0;bottom:0;width:300px;max-height:none;overflow-y:auto;background:rgba(8,11,18,.92);border-left:1px solid var(--line);border-top:0}
body.land .panel{max-width:760px;max-height:94%}
body.land .sheet{align-items:center}
.landNote{display:none}

/* ===== Sideways only (Michael, 2026-10-04: "the game is sideways only"). Held upright, the whole stage turns
   90 degrees so the game stays landscape relative to the phone; resize() sets the sizes, and every pointer
   handler maps its coordinates back through the turn (stagePt / stageRect in p3.js). */
#stage{position:fixed;left:0;top:0;width:var(--sw,100vw);height:var(--sh,100vh);overflow:hidden;background:var(--void);transform-origin:0 0}
body.big #stage{transform:scale(var(--k,1))} /* iPad and desktop: the same layout, drawn bigger (resize() in p3.js) */
body.rot #stage{transform-origin:0 0;transform:translateX(var(--vw,100vw)) rotate(90deg) scale(var(--k,1))}
#stage #app{height:100%}

/* ===== The cockpit skin (Michael's mockups, Gemini image-07/09/10/11): navy panels with glowing cyan edges,
   cut from the Gemini UI sheet (art/ui_*.png) and laid on as 9-slice frames. */
:root{--navy:#0c1626;--navy2:#11213a;--edge:#3fc8ec;--edgeDim:rgba(63,200,236,.35);--glow:0 0 10px rgba(63,200,236,.35);--gold:#ffc24a;--seg:#123040;--segLine:#2f8fb0}
.frame{border:0;border-image:url(art/ui_frame_panel.png) 56 fill / 14px stretch}
.top{border-image:url(art/ui_frame_bar.png) 60 70 fill / 8px 12px stretch;margin:2px 4px 0}
body.land .top{padding:2px 14px;height:30px;box-sizing:border-box}
.hudRes{gap:16px;font-size:11.5px}
.hudRes span{color:var(--edge);text-shadow:0 0 6px rgba(63,200,236,.45)}
.hudRes b{color:#eaf6ff;margin-left:4px;text-shadow:none}
.hudRes .lo b{color:var(--foe)}
body[data-mode="fight"] .sector{display:none}
.topBtn,.top .topBtn{background:linear-gradient(#13243c,#0b1626);border:1px solid var(--edgeDim);color:#9fdcf0;box-shadow:inset 0 0 6px rgba(63,200,236,.18)}
/* the SENSOR VIEW toggle: on = the enemy ship is the big one */
.sensTog{display:flex;align-items:center;gap:7px;height:26px;padding:0 4px 0 12px;border-radius:14px;background:linear-gradient(#10233a,#0a1626);border:1px solid var(--edge);box-shadow:var(--glow);font:600 10.5px var(--display);letter-spacing:.14em;color:#bdefff;white-space:nowrap}
.sensTog i{display:block;width:42px;height:18px;background:url(art/ui_toggle.png) center/100% 100% no-repeat;filter:grayscale(1) brightness(.55);transform:scaleX(-1);transition:filter .2s}
.sensTog[aria-pressed="true"] i{filter:none;transform:none}
.sensTog[hidden]{display:none}

/* buttons: cyan-edged by default, the orange Gemini button for the one main action */
.btn{background:linear-gradient(#12243b,#0b1626);border:1px solid var(--edgeDim);color:#cfefff;box-shadow:inset 0 0 8px rgba(63,200,236,.15)}
.btn.primary{background:linear-gradient(#1b4a63,#123449);border-color:var(--edge);color:#eafaff;box-shadow:var(--glow),inset 0 0 10px rgba(63,200,236,.3)}
.go,.btn.go{background:none;border:0;border-image:url(art/ui_button_primary.png) 40 fill / 10px stretch;color:#2a1300;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.go.running{border-image:none;background:linear-gradient(#12243b,#0b1626);border:1px solid var(--gold);color:var(--gold);text-shadow:none}
.go:disabled{filter:grayscale(.8);opacity:.45}

/* sheets and panels: the side-panel frame */
.sheet{background:rgba(2,6,14,.62)}
.panel{background:none;border:0;border-image:url(art/ui_frame_panel.png) 56 fill / 16px stretch;border-radius:0;padding:18px 22px}
body.land .panel{max-height:calc(100% - 36px);max-width:780px} /* 100% less the sheet padding and the panel's own, so a long sheet never runs off the screen */
body.land .sheet{align-items:center;padding:8px 16px}
.panel h2{color:#e8f8ff;text-shadow:0 0 12px rgba(63,200,236,.55)}
.panel h3{color:var(--edge);opacity:.8}
.choice{background:linear-gradient(90deg,rgba(20,44,70,.9),rgba(12,24,40,.9));border:1px solid var(--edgeDim);border-radius:8px;box-shadow:inset 0 0 8px rgba(63,200,236,.12)}
.choice:not(:disabled):active{border-color:var(--edge)}
/* event decisions, colour-coded like the comms mockup: blue standard, red aggressive, gold needs a resource or crew */
.choice.ev{grid-template-columns:auto 1fr;align-items:center;gap:10px;border-radius:20px;padding:9px 14px}
.choice.ev::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.choice.ev{--c:#4fb4ff;border-color:color-mix(in srgb,var(--c) 70%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,#0b1626),#0b1626 80%)}
.choice.ev b{color:#eaf6ff}
.choice.ev.red{--c:#ff5a46}.choice.ev.gold{--c:#ffc24a}
.evTop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.evTop .evArt{width:230px;margin:0;border:1px solid var(--edge);box-shadow:var(--glow)}
.evText{display:grid;gap:8px;min-width:0}
.evChoices{display:grid;gap:7px}
.lootGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:7px}.lootGrid .choice{align-content:start}
.chip.good{background:rgba(124,242,154,.08)}.chip.bad{background:rgba(255,107,74,.08)}

/* the merchant: goods as cards */
.storeHead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.storeHead p{color:var(--edge)}
.shop{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.shop .choice{grid-template-columns:auto 1fr auto;gap:8px;min-height:58px;border:0;border-image:url(art/ui_frame_button.png) 40 fill / 9px stretch;padding:8px 10px}
.shop .choice:disabled{opacity:.42}
.shop .choice img{width:38px;height:38px;object-fit:contain}
.shop .choice > div{display:grid;gap:2px;min-width:0}
.shop .choice > div span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:10px;line-height:1.3}
.shop .price{color:var(--gold);font-size:14px;white-space:nowrap}
.shop .price::after{content:" ⚙";font-size:11px}

/* upgrades: system icon, segmented bars */
/* the upgrades list: each system is one compact row (name, bars, +1 button side by side), as many rows across as fit,
   so the whole list and the weapons' SELL buttons fit a phone held either way (blind QA 2, 2026-10-04) */
.upg{grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:3px 16px;padding:5px 10px;background:rgba(9,20,34,.75);border:1px solid var(--edgeDim);border-radius:8px}
.uRow{display:flex;align-items:center;gap:8px;min-width:0;min-height:28px}
.uRow .nm{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uRow .uBars{flex:none;max-width:50px;display:flex}.uRow .uBars .pw{flex-wrap:wrap;row-gap:2px}
.uRow .btn,.uRow .thinking{flex:none;min-width:70px;text-align:center}
.upg .btn{min-height:28px;padding:2px 10px;color:var(--gold)}
.wlist{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.wlist .wrow{padding:3px 9px}.wlist .wrow > div{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}.wlist .wrow > div b{display:block}
.wlist .wrow > div span{display:inline}.wlist .wrow > div span + span::before{content:" · "}.wlist .wrow .btn{min-height:28px;padding:2px 10px;flex:none}
.panel:has(.upg) > .pBody{gap:4px}.panel:has(.upg) h3{margin-top:2px}body.land .panel:has(.upg){padding-top:12px;padding-bottom:12px;max-height:calc(100% - 24px)}
.upg .nm{display:flex;align-items:center;gap:7px;color:#dff4ff}
.upg .nm img{width:24px;height:24px;object-fit:contain}
.pw{gap:2px}
.pw b{width:8px;height:12px;border-radius:2px;background:var(--seg);box-shadow:inset 0 0 0 1px var(--segLine)}
.pw b.on{background:linear-gradient(#5dff86,#24b84c);box-shadow:0 0 5px rgba(76,255,122,.6),inset 0 0 0 1px #8dffab}
.pw b.dmg{background:#c8402c;box-shadow:inset 0 0 0 1px #ff8a6a}
.pw b.ion{background:#8d7bff;box-shadow:0 0 5px #9d8cff}

/* the map's side panel */
body.land #deckMap{top:34px;width:290px;background:none;border:0;border-image:url(art/ui_frame_panel.png) 56 fill / 14px stretch;padding:14px 14px 12px;margin:0 4px 4px 0;bottom:0}
#deckMap .card{background:rgba(9,20,34,.85);border-color:var(--edgeDim)}
#deckMap .stats span{color:var(--edge)}#deckMap .stats b{color:#eaf6ff}

/* ===== landscape fight HUD ===== */
body.land #sysBox{left:6px;top:4px;bottom:6px;width:142px;max-height:none;gap:4px;padding-right:2px}
body.land #sysBox .rowLabel.sysHead{display:flex!important;flex-direction:column;align-items:flex-start;gap:2px;font:600 9px var(--display);letter-spacing:.16em;color:var(--edge);margin:0 0 1px}
.reactor{gap:4px;color:#9fdcf0;font-size:9px;letter-spacing:.08em}.reactor .pw{gap:1.5px}.reactor .pw b{width:4px;height:9px}.reactor::before{content:"REACTOR";color:var(--edge);font-size:8.5px}
body.land #systems{gap:4px}
body.land .sys{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr);grid-template-rows:auto auto;column-gap:6px;row-gap:4px;align-items:center;align-content:center;height:auto;min-height:40px;padding:7px 9px 7px 8px;border:0;border-image:url(art/ui_frame_button.png) 40 / 8px stretch;border-radius:8px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--tint,#3fc8ec) 30%,#0b1626),#0b1626 85%);box-shadow:inset 0 0 10px color-mix(in srgb,var(--tint,#3fc8ec) 25%,transparent)}
body.land .sys .ico{grid-row:1/3;width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 3px rgba(0,0,0,.6))}
body.land .sys .lbl{font:600 11px/1 var(--display);letter-spacing:.1em;color:#eaf6ff;align-self:end;white-space:nowrap}
body.land .sys .pw{align-self:start}
body.land .sys .pw b{width:9px;height:7px}
body.land .sys.off{filter:saturate(.35) brightness(.75)}
body.land .sys.hurt{box-shadow:inset 0 0 12px rgba(255,80,50,.55)}
.sys.s-shields{--tint:#3f9cff}.sys.s-engines{--tint:#ff8a2a}.sys.s-medbay{--tint:#3fd27a}.sys.s-oxygen{--tint:#3fc8ec}.sys.s-cloak{--tint:#9d6bff}
/* the subsystems (pilot, sensors, doors) and the weapons system: bars and damage only, no power taps (CONVENTIONS 3) */
.subsys{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.ss{display:flex;align-items:center;gap:4px;min-width:0;height:26px;box-sizing:border-box;padding:0 5px;border:1px solid rgba(127,216,255,.28);border-radius:5px;background:rgba(13,20,32,.82)}
.ss img{width:16px;height:16px;object-fit:contain;flex:none}
.ss .lbl{font:600 8.5px/1 var(--display);letter-spacing:.08em;color:#cfe3f5;flex:none}
.ss .pw{display:flex;gap:2px;flex-wrap:nowrap;overflow:hidden}
.ss .pw b{width:5px;height:6px}
.ss.s-weapons{grid-column:1/-1}
.ss.hurt{box-shadow:inset 0 0 9px rgba(255,80,50,.6)}.ss.off{filter:saturate(.35) brightness(.7)}
.ss.s-doors{cursor:pointer}.ss.s-doors.held{border-color:rgba(255,176,80,.8);background:rgba(48,30,12,.85)}.ss.s-doors.held .lbl{color:#ffc27a}
.sys.s-drones{--tint:#d0a640}.sys.s-tele{--tint:#b56bff}.sys.s-lock{--tint:#ff5a46}.sys.s-sensors{--tint:#3fd2a8}.sys.s-doors{--tint:#e6c23a}
/* weapons: the Gemini weapon buttons, with the charge ring round them */
body.land #wepBox{right:max(10px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));width:auto} /* a safe margin from the screen edges */
body.land #wepBox .rowLabel{display:block!important;text-align:center;font:600 9px var(--display);letter-spacing:.2em;color:var(--edge);margin:0 0 2px;text-shadow:0 0 6px rgba(63,200,236,.5)}
body.land .weps{grid-template-columns:repeat(2,60px);gap:5px 8px}
body.land .wep{width:60px;height:60px;border:0;background:var(--art,none) center/100% 100% no-repeat,#0b1626;box-shadow:0 0 0 1px rgba(63,200,236,.25);overflow:visible}
body.land .wep::before{inset:-2px;z-index:1;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
body.land .wep .nm{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);z-index:2;font:700 8px/1 var(--display);letter-spacing:.06em;white-space:nowrap;padding:2px 5px;border-radius:7px;background:rgba(6,12,22,.92);border:1px solid var(--edgeDim);color:#dff4ff;display:block}
body.land .wep .nm .pw,body.land .wep .sub{display:none}
body.land .wep .tgt{position:absolute;top:0;right:-4px;z-index:2;font:700 11px/1 var(--display);letter-spacing:.04em;white-space:nowrap;padding:2px 5px;border-radius:6px;background:#3a0f0c;border:1px solid #ff5a46;color:#ffb3a6}
body.land .wep .tgt:empty{display:none}
body.land .wep.off{opacity:1;filter:grayscale(.85) brightness(.6)}
body.land .wep.ready{box-shadow:0 0 12px rgba(124,242,154,.55)}
body.land .wep.sel{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(255,194,74,.6)}
/* crew: round portrait frames with a health bar, along the bottom like the mockup */
body.land #crewBox{left:154px;right:150px;bottom:3px;width:auto;display:flex;justify-content:center;pointer-events:none}
body.land #crewBox .crewRow{pointer-events:auto;flex-wrap:nowrap;gap:6px;justify-content:center}
body.land .crewCard{position:relative;width:46px;padding:0;border:0;border-radius:0;background:none;display:grid;justify-items:center;gap:1px}
body.land .crewCard img{position:relative;z-index:1;width:34px;height:34px;margin-top:4px;border-radius:50%;object-fit:cover}
body.land .crewCard::before{content:"";position:absolute;left:50%;top:0;width:42px;height:42px;transform:translateX(-50%);background:url(art/ui_portrait.png) center/100% 100% no-repeat;pointer-events:none}
body.land .crewCard .cc{position:relative;z-index:1;width:40px;gap:1px;margin-top:3px}
body.land .crewCard .cc b{font:600 8px/1.1 var(--display);text-align:center;color:#dff4ff;text-shadow:0 1px 2px #000}
body.land .crewCard .hpb{height:4px;background:#5a1a16;border-radius:1px;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
body.land .crewCard.sel::before{filter:sepia(1) saturate(4) hue-rotate(5deg) brightness(1.15)}
body.land .crewCard.sel{filter:drop-shadow(0 0 6px rgba(255,194,74,.7))}
body.land .crewCard.dead{opacity:.35}
/* top-right actions */
body.land .actRow{top:4px;right:6px}
body.land .actRow .act{min-height:30px;border:0;border-image:url(art/ui_frame_button.png) 40 fill / 7px stretch;color:#bfeeff;background:none}
body.land .actRow .act.armed{color:var(--gold)}
body.land .actRow .act .bar{background:var(--edge)}
body.land .hint{top:20px;bottom:auto;left:154px;right:300px;text-align:left;font-size:10px;color:#a9d8ea;-webkit-line-clamp:4} /* right: fitHint() (p3.js) */
body.land .coach{background:rgba(8,16,28,.96);border:1px solid var(--edge);box-shadow:var(--glow);padding:8px 10px;gap:6px}
body.land .coach p{font-size:12.5px}
body.land .coachBtns button{min-height:38px}

/* ===== the hangar, landscape: hull on the left, loadout on the right (Concept 5) ===== */
body.land .panel:has(.hangar){max-width:820px;width:100%}
body.land .hangar{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);column-gap:16px;align-items:start}
.hgL,.hgR{display:grid;gap:7px;min-width:0;align-content:start}
body.land .hgName{font-size:24px;color:#e8f8ff;text-shadow:0 0 12px rgba(63,200,236,.5)}
body.land .hgBlurb{font-size:11.5px}
body.land .hgStats{grid-template-columns:repeat(5,1fr)}
body.land .hgStats div{padding:4px 2px}
body.land .hgCrew span{width:52px}body.land .hgCrew img{width:38px;height:38px}
.hgStats div,.hgGuns span{background:rgba(10,22,38,.9);border-color:var(--edgeDim)}
.hgStats b{font-size:16px}
.hgGuns span{display:grid;grid-template-columns:auto 1fr;column-gap:6px;align-items:center}
.hgGuns span img{grid-row:1/3;width:30px;height:30px}
.hgCrew img{border-radius:50%;border:2px solid var(--edge);box-shadow:var(--glow)}

/* ===== the opening screen: one crew at a time, full screen, swipe to change ===== */
#opening{position:absolute;inset:0;z-index:8;overflow:hidden;background:#04070d;touch-action:none;user-select:none;-webkit-user-select:none}
#opening[hidden]{display:none}
.opTrack{position:absolute;inset:0;display:flex;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.opSlide{position:relative;flex:0 0 100%;height:100%;overflow:hidden}
.opSlide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;image-rendering:auto;pointer-events:none}
.opSlide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,7,14,.92) 0%,rgba(3,7,14,.7) 30%,rgba(3,7,14,0) 58%),linear-gradient(0deg,rgba(3,7,14,.85),rgba(3,7,14,0) 32%)}
.opInfo{position:absolute;left:max(22px,env(safe-area-inset-left));top:16px;z-index:1;width:min(42%,360px);display:grid;gap:6px}
.opKick{font:600 10px var(--display);letter-spacing:.26em;color:var(--edge);text-shadow:0 0 8px rgba(63,200,236,.6)}
.opName{margin:0;font:700 clamp(22px,4.2vw,34px)/1 var(--display);letter-spacing:.08em;color:#f1fbff;text-shadow:0 0 18px rgba(63,200,236,.45)}
.opMotif{margin:0;font:500 italic 13px/1.35 var(--mono);color:#cfe6f5}
.opRules{margin:2px 0 0;padding:8px 10px 8px 12px;list-style:none;display:grid;gap:5px;border:0;border-image:url(art/ui_frame_panel.png) 56 fill / 10px stretch}
.opRules li{position:relative;padding-left:14px;font:500 11.5px/1.3 var(--mono);color:#e1f1fb}
.opRules li::before{content:"";position:absolute;left:0;top:5px;width:6px;height:6px;background:var(--edge);box-shadow:0 0 6px var(--edge);transform:rotate(45deg)}
.opSoon{font:600 9px var(--display);letter-spacing:.14em;color:var(--gold)}
.opBrand{position:absolute;right:max(16px,env(safe-area-inset-right));top:10px;z-index:2;font:700 14px var(--display);letter-spacing:.3em;color:#e8f8ff;text-shadow:0 0 10px rgba(63,200,236,.6)}
.opBrand i{font-style:normal;color:var(--edge)}
.opKeys{position:absolute;right:max(16px,env(safe-area-inset-right));top:36px;z-index:2;min-height:28px;padding:3px 12px;border-radius:8px;border:1px solid var(--edgeDim);background:rgba(8,16,28,.7);color:#bfeeff;font:600 10.5px var(--display);letter-spacing:.18em}
.opKeys[hidden]{display:none}
.opArrow{position:absolute;top:50%;z-index:2;width:44px;height:64px;margin-top:-40px;border-radius:10px;border:1px solid var(--edgeDim);background:rgba(8,16,28,.6);color:var(--edge);font-size:20px}
/* the arrows sit mid-height, exactly where a landscape iPhone's camera island and curved edge are: keep them inside the
   safe area (the stage's left and right are the phone's top and bottom when it's held upright and turned) */
#opening{--opSafeL:env(safe-area-inset-left,0px);--opSafeR:env(safe-area-inset-right,0px)}
body.rot #opening{--opSafeL:env(safe-area-inset-top,0px);--opSafeR:env(safe-area-inset-bottom,0px)}
.opArrow.l{left:max(8px,var(--opSafeL))}.opArrow.r{right:max(8px,var(--opSafeR))}
.opArrow:disabled{opacity:.25}
.opDots{position:absolute;left:50%;bottom:62px;z-index:2;transform:translateX(-50%);display:flex;gap:8px}
.opDots i{width:8px;height:8px;border-radius:50%;background:rgba(160,200,220,.35)}.opDots i.on{background:var(--edge);box-shadow:0 0 6px var(--edge)}
.opBar{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px max(16px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left))}
.opBar .btn{min-height:40px;font-size:10.5px;padding:6px 10px}
.opBar .play{min-width:170px;min-height:46px;font:700 16px var(--display);letter-spacing:.24em}
.opBar .cont{min-height:46px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== QA pass 2026-10-04: feedback on blocked taps, readable store cards, close buttons that stay in view ===== */
.shop .choice.no{opacity:.5}
.shop .choice.open{opacity:1;box-shadow:0 0 0 2px var(--gold) inset,0 0 12px rgba(255,194,74,.35)}
/* the open item's full text and what it costs you, in the footer beside the buttons: a fixed-size strip, so no card moves */
.shopFoot{flex-wrap:nowrap;align-items:center}.shopFoot > .btn{flex:none}
.shopInfo{flex:1 1 auto;min-width:0;height:44px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:1px;padding-left:6px;font:500 10.5px/1.3 var(--mono);color:var(--dim)}
.shopInfo b{font:600 11px/1.25 var(--display);letter-spacing:.06em;color:#e8f8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shopInfo span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shopInfo b + span{-webkit-line-clamp:1}
.shopInfo .buyCue{margin-top:0}
@media (hover:hover) and (pointer:fine){ .shop .choice:not(:disabled):hover{box-shadow:0 0 0 1px var(--edge) inset,0 0 10px rgba(63,200,236,.3)} .shop .choice.open:hover{box-shadow:0 0 0 2px var(--gold) inset,0 0 12px rgba(255,194,74,.35)} }
.shop .choice .buyCue{display:block;font:600 10px/1.3 var(--display);font-style:normal;letter-spacing:.1em;color:var(--gold);margin-top:2px}
.shop .choice .buyCue.bad{color:#ff8a8a}
.btn.no{opacity:.5}
.btn.armed{color:#ffd6d6;border-color:#ff6b6b;box-shadow:0 0 10px rgba(255,107,107,.35)}
.nope{position:absolute;left:50%;top:10px;transform:translate(-50%,-6px);z-index:12;max-width:80%;padding:7px 14px;border-radius:8px;background:rgba(40,10,14,.95);border:1px solid #ff6b6b;color:#ffe3e3;font:600 12px/1.3 var(--display);letter-spacing:.04em;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.nope.on{opacity:1;transform:translate(-50%,0)}
/* a long sheet's last row of buttons (BACK, DONE, LEAVE) sticks to the bottom so it never scrolls away */
.panel.hasFoot{display:flex;flex-direction:column;overflow:hidden;gap:0}
.panel.hasFoot > .pBody{display:grid;gap:10px;align-content:start;overflow:auto;overscroll-behavior:contain;min-height:0;flex:1 1 auto;padding:0 4px 4px 0}
.panel.hasFoot > .btnRow{flex:none;padding-top:10px;border-top:1px solid rgba(63,200,236,.18);margin-top:6px}
.opBar #opMyth{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choice.picked{box-shadow:0 0 0 1px var(--gold) inset}

/* ===== iPad and desktop (PILLARS 12): hover tooltips and the key list (src/platform.js) ===== */
.tip{position:absolute;z-index:40;max-width:230px;display:grid;gap:2px;padding:7px 10px;border-radius:8px;background:rgba(6,12,22,.96);border:1px solid var(--edge);box-shadow:var(--glow),0 6px 18px rgba(0,0,0,.5);pointer-events:none;font:500 10.5px/1.35 var(--mono);color:#cfe6f5}
.tip[hidden]{display:none}
.tip b{font:700 11.5px/1.2 var(--display);letter-spacing:.1em;color:#eaf6ff}
.tip i{font-style:normal;font-size:9.5px;color:var(--edge);opacity:.85}
.tip .hit{font:700 11px/1.3 var(--display);letter-spacing:.06em;color:var(--gold)}
.keyGrid{display:grid;gap:5px}
.keyGrid h3{margin:6px 0 0}
.keyRow{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:12px;align-items:center;font-size:12px;color:#d7ecf8}
.keyRow kbd{display:inline-block;min-width:16px;text-align:center;padding:2px 6px;margin:1px 0;border-radius:5px;border:1px solid var(--edgeDim);background:#0b1626;box-shadow:inset 0 -2px 0 rgba(63,200,236,.18);font:600 11px var(--display);color:#eaf6ff}
.top #keysBtn{min-width:0}

<script>
/* ============================================================
   THE MOD — every rule, weapon, ship, enemy, price and reward.
   The Ship's AI rewrites this object; the engine below reads it.
   ============================================================ */
const DEFAULT_MOD = {
  version: 7,
  rules: {
    shieldRecharge: 2.0,       // seconds to restore one shield layer (used only if shieldRechargeByLayer is missing)
    shieldRechargeByLayer: [2.0, 2.0, 1.72, 1.5, 1.33], // seconds to raise layer 1, 2, 3, 4, 5 (FTL S2); a hit keeps the progress made (S6)
    powerPerLayer: 2,          // shield power bars per layer
    evasionByEngines: [0, 5, 10, 15, 20, 25, 28, 31, 35], // % dodge by engine power (FTL E1)
    mannedEvasion: [5, 7, 10], // % dodge for a crewed pilot seat, and again for crewed engines, by that skill 0/1/2 (FTL E2)
    autopilot: [0, 0, 0.5, 0.8], // share of dodge kept with the pilot seat empty, by piloting level (FTL E3)
    weaponsMannedSpeed: 0.1,   // (old rule, unused while weaponsMannedTime is set)
    weaponsMannedTime: [0.90, 0.85, 0.80], // a manned gun charges in this share of its time, by the gunner's weapons skill 0/1/2 (FTL C2)
    repairTime: 12.5,          // seconds for one untrained Terran to fix one bar (FTL I6; race and repair skill +10%/+20% scale it)
    crewHitDamage: 15,         // crew hp lost per point of damage to their room
    medbayHeal: [0, 6.4, 9.6, 19.2], // hp per second by medbay power 0-3 (FTL M1); a plain number = per bar
    ionDuration: 5,            // seconds one point of ion locks a bar; stacks (FTL I1)
    ionLocksShields: 1,        // 1: an ion shot a shield layer absorbs also ionises the shield system (FTL: how ion strips shields); 0: it only pops the layer
    enemyQuietTime: 3,         // seconds at the start of a fight before the enemy crew have their guns and teleporter manned (FTL C9, T3)
    laserFlight: 0.45,         // seconds a laser bolt flies
    missileFlight: 0.9,
    fireSysTime: 12.5,         // seconds of fire per bar of system damage (FTL F2: 0.08 per s)
    fireSpread: 0.05,          // chance per second a fire spreads through each OPEN door to the next room, at full air (scaled by the room's oxygen); never through a sealed door
    fireCrewDps: 2.1,          // hp per second lost standing in fire (FTL F1: 2.13)
    extinguishTime: 5.7,       // fire-fighting pace: against the fire's regrowth one crew needs about 10.5 s (FTL F5)
    breachCrewDps: 0,          // a breach never hurts crew directly; only the thin air does (FTL O-rules)
    sealTime: 12.5,            // seconds for one untrained crew to seal a breach, same as a bar (FTL O8)
    crewDps: 6,                // hand-to-hand damage per second (FTL K4: ~6, a 100 v 100 fight lasts ~15 s)
    sabotageTime: 15,          // seconds one Terran boarder needs to break one bar (FTL I9: about 15 s); x combat (a Skitterer 10 s); boarders add up
    doorHp: 4,                 // hits a door takes per door level (FTL D2 Normal: level 2 = 8, level 3 = 12); manned doors count one level higher (D1)
    doorHitRate: 1,            // hits per second a boarder lands on a door (FTL D3), x their race's combat
    doorBrokenTime: 7,         // seconds a broken door hangs open before it heals and shuts (FTL D4)
    walkSpeed: 2.2,            // FTL tiles per second a Terran walks (FTL K2: 2.19)
    restTime: 10,              // seconds the crew rest in the medbay at the beacon after a fight, healing at its rate
    surrenderChance: 0.5,      // share of crewed ships (not Skitterer, not bosses) that offer to surrender at 20-40% hull (FTL A3)
    fleeOdds: [1, 0.15, 0.6, 1], // share of the runner ships that actually run, by sector (index = sector, the last for later ones): sector 1 rarely (PILLARS 9), FTL's every runner from sector 3
    fleeLateS1: 0.5,           // sector 1's runners wait this much longer: they spool at 10-20% hull instead of 20-40% (PILLARS 9)
    enemyVentDelay: 3,         // seconds your boarders hold a hull room the enemy crew can't win before it opens that room's airlocks (ESTIMATE)
    enemyHealAt: 0.35,         // an enemy crew member below this share of health walks to a working medbay (ESTIMATE)
    enemyDefendOdds: 1.2,      // enemy defenders gather until they are this much stronger than the boarders in a room (ESTIMATE)
    stalemateTime: 60,         // seconds with no hull damage on either side before the enemy gives up and jumps (FTL A6); +2 fuel
    stalemateFuel: 2,
    cloakTime: 5,              // seconds of cloak per level
    cloakCooldown: 20,         // FTL L2
    cloakEvasion: 60,
    teleportTime: 20,          // seconds to charge the teleporter at level 1
    teleportTimes: [0, 20, 15, 10], // by teleporter level (FTL T1)
    droneDefenseCd: 3.2,       // seconds between defense-drone intercepts
    droneCombatCd: 4.5,        // seconds between combat-drone shots
    ftlChargeTime: 32,         // (old rule, unused while enemyFleeTimes is set)
    enemyFleeTimes: [0, 22, 19, 17, 15, 14, 13, 12, 11], // seconds a running ENEMY needs to spool, by engine power (FTL A4: about 15 s)
    jumpChargeTimes: [0, 68, 61.5, 55, 48.5, 42, 35.5, 29, 23], // seconds to spool YOUR drive in a fight, by engine power (FTL J2)
    enginesMannedJump: [1.10, 1.17, 1.25], // drive spools this much faster with engines manned, by engines skill (FTL J3)
    hazardJumpTime: 23,        // seconds to spool with no enemy ship, only a hazard (FTL J2)
    enemyScalePerSector: 0.1,  // enemy hull grows this much per sector (shields carry the difficulty: 1/2/3/4 layers by sector)
    counterChance: 0.28,       // base chance an enemy is fitted against your build
    xpLevel1: 40, xpLevel2: 110, // skill experience needed for each level
    bondTime: 40,              // seconds side by side before two crew bond
    startFuel: 10, startScrap: 20, threatStart: -3,
    // Oxygen. Every room holds 0-100% air. The oxygen system refills it; without it the
    // ship slowly leaks. Breaches and open airlocks (venting) drain a room fast, fire
    // burns air and dies in a near-vacuum, and crew in thin air suffocate.
    o2Refill: 1.2,             // % per second at oxygen level 1, every room (measured in FTL 2026-10-03)
    o2Levels: [0, 1, 4, 7],    // refill multiplier by oxygen power (FTL O1: 1x / 4x / 7x)
    o2Leak: 1.2,               // % per second every room loses with no working oxygen system (measured: ~1.2)
    o2BreachDrain: 6,          // % per second a breached room loses (FTL O3: oxygen 2 holds one breach, oxygen 1 cannot)
    o2VentDrain: 22,           // % per second a vented room loses (airlocks open)
    o2Flow: 0.25,              // how fast two rooms even out through an open door (share of the difference per second); a sealed door holds air (FTL O5)
    o2Suffocate: 5,            // below this % in their room crew start to suffocate (FTL O6)
    suffocateDps: 5.5,         // hp per second lost while suffocating (measured: ~5.5)
    fireO2Burn: 1,             // % per second a burning room consumes (FTL F3: 0.96)
    fireNeedsO2: 10,           // a fire goes out below this % (FTL F4)
    doorBoarderDrag: 0         // (retired: boarders now stop and break each door, doorHp)
  },
  // Weapons by family. Lasers pop one shield layer per shot. Missiles ignore shields but cost ammo.
  // Beams never pop shields; they sweep across rooms, doing damage minus shield layers in each.
  // Ion locks shields or systems. fire / breach are hit chances, FTL's own per weapon (none listed = 0); chain charges faster each volley.
  // sp = shield piercing (FTL): a shot passes this many shield layers untouched (missiles carry 5).
  // bomb = teleported in (FTL H7): it cannot be dodged, skips the shields and defense drones never see it; it still uses a missile.
  // Cooldowns are FTL's (docs/COMBAT-RULES.md WE4); the Basic Laser takes FTL's Burst Laser I's 10 s.
  weapons: {
    basic:    {name:"Basic Laser",     type:"laser",   shots:1, dmg:1, cd:10,  power:1, price:25, tier:0, fire:0.1},
    burst1:   {name:"Burst Laser I",   type:"laser",   shots:2, dmg:1, cd:11, power:2, price:45, tier:1, fire:0.1},
    burst2:   {name:"Burst Laser II",  type:"laser",   shots:3, dmg:1, cd:12, power:2, price:65, tier:2, fire:0.1},
    heavy:    {name:"Heavy Laser I",   type:"laser",   shots:1, dmg:2, cd:9,  power:1, price:45, tier:1, fire:0.3, breach:0.3},
    heavy2:   {name:"Heavy Laser II",  type:"laser",   shots:2, dmg:2, cd:13, power:3, price:75, tier:3, fire:0.3, breach:0.3},
    chain:    {name:"Chain Laser",     type:"laser",   shots:2, dmg:1, cd:16, power:2, price:60, tier:2, chain:0.15, fire:0.1},
    flak:     {name:"Flak I",          type:"laser",   shots:3, dmg:1, cd:10, power:2, price:55, tier:2, flak:true},
    flak2:    {name:"Flak II",         type:"laser",   shots:7, dmg:1, cd:21, power:3, price:80, tier:3, flak:true},
    pierce:   {name:"Heavy Pierce Laser", type:"laser", shots:1, dmg:2, cd:10, power:2, price:55, tier:2, sp:1, fire:0.3, breach:0.3},
    leto:     {name:"Leto Missile",    type:"missile", shots:1, dmg:1, cd:9,  power:1, price:25, tier:0, sp:5, fire:0.1, breach:0.1},
    artemis:  {name:"Artemis",         type:"missile", shots:1, dmg:2, cd:11, power:1, price:40, tier:1, sp:5, fire:0.1, breach:0.1},
    hermes:   {name:"Hermes",          type:"missile", shots:1, dmg:3, cd:14, power:3, price:55, tier:2, sp:5, fire:0.3, breach:0.2},
    pegasus:  {name:"Pegasus",         type:"missile", shots:2, dmg:2, cd:20, power:3, price:65, tier:3, sp:5, fire:0.3, breach:0.2},
    hull:     {name:"Hull Missile",    type:"missile", shots:1, dmg:2, cd:17, power:2, price:65, tier:2, sp:5, fire:0.1, breach:0.3},
    firebomb: {name:"Fire Bomb",       type:"missile", shots:1, dmg:0, cd:15, power:2, price:40, tier:1, fire:1, bomb:true},
    pike:     {name:"Pike Beam",       type:"beam",    shots:1, dmg:1, cd:16, power:2, price:35, tier:1, len:3},
    halberd:  {name:"Halberd Beam",    type:"beam",    shots:1, dmg:2, cd:17, power:3, price:65, tier:2, len:2},
    glaive:   {name:"Glaive Beam",     type:"beam",    shots:1, dmg:3, cd:25, power:4, price:90, tier:3, len:1},
    firebeam: {name:"Fire Beam",       type:"beam",    shots:1, dmg:0, cd:20, power:2, price:45, tier:2, len:3, fire:0.8},
    ion:      {name:"Ion Blast",       type:"ion",     shots:1, dmg:0, cd:8,  power:1, price:30, tier:0, ion:1},
    heavyion: {name:"Heavy Ion",       type:"ion",     shots:1, dmg:0, cd:13, power:2, price:50, tier:2, ion:2},
    ion2:     {name:"Ion Blast II",    type:"ion",     shots:1, dmg:0, cd:4,  power:3, price:60, tier:3, ion:1}
  },
  species: {
    // the three races of Michael's sprite sheets (2026-10-03): Terran, Skitterer, Lumina. Tinker and Basalt are retired:
    // kept only so an old save still loads (its Tinkers become Terrans, its Basalts Skitterers).
    human:  {name:"Terran", hp:100, speed:1,   repair:1,   combat:1,   desc:"Humanoid spacers in navy flight suits. Adaptable: no gift and no weakness."},
    tinker: {retired:true, name:"Tinker", hp:90,  speed:1,   repair:2,   combat:0.5, desc:"Small four-armed engineers. Repair twice as fast; poor fighters."},
    myrm:   {name:"Skitterer", hp:100, speed:1.3, repair:0.5, combat:1.5, desc:"Mantis-like insectoids. Fast, and 1.5x damage hand to hand; clumsy with tools."},
    basalt: {retired:true, name:"Basalt", hp:150, speed:0.6, repair:1,   combat:1.2, fireproof:true, desc:"Living stone. Slow, very tough, and fire cannot hurt them."},
    lumen:  {name:"Lumina",  hp:70,  speed:1,   repair:1,   combat:0.8, powers:true, nobreath:true, desc:"Beings of light. The system they stand in gets a free power bar, and they need no air."}
  },
  // Ship size (Michael, 2026-10-03): small ships run and hide, big ships are tough, and the way up is to take
  // one. hull/crew/shields/guns grow an enemy of that size; evade and ftl apply to any ship of that size; hide is
  // the base chance to slip past a bigger ship; lock is the chance a big enemy carries a warp lock (sector 2+);
  // scrap multiplies salvage; reactor is the bars a captured ship of that size adds over a small one.

const SYSTEMS = ["shields","engines","weapons","medbay","oxygen","pilot","doors","sensors","cloak","drones","tele","lock"];
// subsystems: like the cockpit they take no reactor power; they work as long as they are not broken
const SUBSYS = ["pilot","doors","sensors"];
// ship size: small runs and hides, large is tough (MOD.sizes); a small ship has no room for a teleporter
const SIZE_ORDER = ["small","medium","large"];
function sizeOf(x){ return x && SIZE_ORDER.includes(x.size) ? x.size : "medium"; }
function sizeRule(x){ const t = MOD.sizes || DEFAULT_MOD.sizes; return t[sizeOf(x)] || DEFAULT_MOD.sizes[sizeOf(x)]; }
function sizeRank(x){ return SIZE_ORDER.indexOf(sizeOf(x)); }
function canFit(ship, id){ return !(id === "tele" && sizeOf(ship) === "small"); }
// a warp lock on one ship stops the other ship's jump drive while it has power
function warpLocked(ship){ const o = S && (ship === S.you ? S.foe : S.you); return !!(o && o.sys && o.sys.lock && eff(o, "lock") > 0); }
const SYS_LABEL = {shields:"SHIELDS",engines:"ENGINES",weapons:"WEAPONS",medbay:"MEDBAY",oxygen:"OXYGEN",pilot:"PILOT",doors:"DOORS",sensors:"SENSORS",cloak:"CLOAK",drones:"DRONES",tele:"TELEPORT",lock:"WARP LOCK"};

const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];

function rng32(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rpick = (r, a) => a[Math.floor(r()*a.length)];
function hashStr(s){ let h = 2166136261; for (const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }

/* ---------------- crew ---------------- */
const SP = c => MOD.species[c.species] || MOD.species.human;
function lvl(c, skill){ const x = (c.xp || {})[skill] || 0; return x >= MOD.rules.xpLevel2 ? 2 : x >= MOD.rules.xpLevel1 ? 1 : 0; }
function makeCrew(c, side){
  const species = MOD.species[c.species] ? c.species : "human", sp = MOD.species[species];
  const xp = {}; for (const k of SKILLS) xp[k] = 0;
  if (c.bonus && xp[c.bonus] !== undefined) xp[c.bonus] = MOD.rules.xpLevel2;
  const maxHp = c.maxHp || sp.hp;
  return {name:c.name || "", species, color:c.color || pick(CREW_COLORS), side, on:side, room:c.room, dest:c.room, station:c.station || c.room,
    hp: c.hp ?? maxHp, maxHp, gx:null, gy:null, fix:0, xp, kills:0, bonds:{}, grief:0, lastBark:-99, seed: c.seed || Math.floor(Math.random()*1e9),
    bio: c.bio || null, face:0, act:"idle", ...(c.mindLink ? {mindLink: true} : {}), ...(c.look ? {look: c.look} : {})};
}
function crewTitle(c){ const best = SKILLS.filter(k => lvl(c,k) > 0).sort((a,b) => lvl(c,b) - lvl(c,a))[0]; return best ? BONUS_LABEL[best] : "hand"; }
function bonded(a, b){ return (a.bonds[b.name] || 0) >= MOD.rules.bondTime; }
function workMult(c){
  let m = c.grief > 0 ? 0.75 : 1;
  if (allCrew().some(o => o !== c && o.side === c.side && o.on === c.on && o.room === c.room && o.hp > 0 && bonded(c, o))) m *= 1.15;
  return m;
}
function gainXp(c, skill, amt){
  if (c.side !== "you" || !c.xp) return;
  const before = lvl(c, skill); c.xp[skill] = (c.xp[skill] || 0) + amt;
  if (lvl(c, skill) > before){ float(S[c.on], c.room, `${c.name.toUpperCase()}: ${SKILL_LABEL[skill].toUpperCase()} ${lvl(c,skill)}`, "#ffc857"); bark(c, "levelup", true); AUDIO.ui("levelup"); }
}

const FLAT_SHIPS = true;

  else if (free(wr.x - 1, wr.y)) edge = {dir: "side", sx: -1, x: wr.x, y0: wr.y, y1: wr.y + wr.h};
  else if (free(wr.x + wr.w, wr.y)) edge = {dir: "side", sx: 1, x: wr.x + wr.w, y0: wr.y, y1: wr.y + wr.h};

/* ---------------- crew get about on a deck + room graph ----------------

  const L = ship.layout, adj = Object.fromEntries(L.map(q => [q.id, []])), add = (a, b, e) => { adj[a].push({...e, to: b}); };
  const deckOf = q => plan.deckOf(q.y);
  for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++){
    const a = L[i], b = L[j]; if (deckOf(a) !== deckOf(b)) continue;
    let pt = null;
    if (a.x + a.w === b.x || b.x + b.w === a.x){ const y0 = Math.max(a.y, b.y), y1 = Math.min(a.y + a.h, b.y + b.h); if (y1 > y0) pt = {x: a.x + a.w === b.x ? b.x : a.x, y: (y0 + y1)/2}; }

function crewRoute(ship, from, to, x, y){

/* ---------------- fight flow ---------------- */
function prepShip(ship){
  // a teleporter is ready when a fight opens (FTL T3); the enemy waits until its crew have manned up (enemyQuietTime)
  ship.shT = 0; ship.flash = 0; ship.hz = {}; ship.cloakT = 0; ship.cloakCd = 0; ship.teleCharge = 1; ship.ftl = 0; ship.fleeing = false; ship.phase2done = false;
  ship.o2 = {}; ship.vent = {}; for (const r of ship.layout || []) ship.o2[r.id] = 100;
  if (typeof doorsReset === "function") doorsReset(ship); // FTL D6: every door sealed and whole again
  ship.weapons.forEach(w => { w.charge = 0; w.target = null; w.stack = 0; }); // every gun starts cold (FTL C9)
  ship.drones.forEach(d => { d.t = 0; d.ang = Math.random()*6.283; });
  for (const c of ship.crew){ if (c.hp <= 0) continue; c.on = ship.key; c.gx = null; c.gy = null; c.fix = 0; c.grief = 0; c.hurtSaid = false; if (!room(ship, c.dest)) c.dest = ship.layout[0].id; c.room = c.dest; }
  for (const s of Object.values(ship.sys)){ s.ion = 0; s.sab = 0; s.rep = 0; }
  ship.layers = 0; ship.layers = maxLayers(ship);
}
function startFight(foe, opts = {}){
  closeSheet();
  S = {mode:"fight", focus:"you", paused:true, over:null, selW:null, selC:null, boardArm:false, you:R.you, foe, fx:[], parts:[], floats:[], zaps:[], rings:[], bubbles:[],
       shake:0, t:0, aiT:0, lastHullT:0, offer:null, hitstop:0, slow:0, redFlash:0, foeDmgMult: 1 + 0.06*(R.sector-1), boss: !!opts.boss, intro: opts.intro || "", saidLow:false, saidShields:0};
  prepShip(R.you); prepShip(foe);
  for (const c of [...R.you.crew, ...foe.crew]) if (c.hp > 0){ c.gx = null; crewPlace(S[c.on], c, shipNav(S[c.on])); } // crew stand at their posts while the fight opens paused
  for (const d of R.pendingSysDmg || []){ const s = R.you.sys[d.system]; if (s) s.dmg = Math.min(s.level, s.dmg + d.amount); }
  R.pendingSysDmg = [];
  clampPower(R.you); restorePower(R.you); // a reload mid-fight brings your shields and medbay back on
  setMode("fight");
  $("sector").textContent = `SECTOR ${R.sector} · vs ${foe.name}`;
  buildDeck();
  const notes = foe.notes.length ? " " + foe.notes.join(" ") : "";
  if (foe.env) setHint((opts.intro ? opts.intro + " " : "") + "Nothing to shoot. Keep the shields up, fight the fires, and jump the moment the drive spools.");
  else setHint((opts.intro ? opts.intro + " " : "") + (R.fights === 0 ? "Paused. Pick a weapon, tap an enemy room, then Resume." : `${foe.name} on scope.${notes}`));
  if (STAGE.ok) STAGE.cine(opts.boss ? 3.4 : 2.2, opts.boss && !foe.env ? "boss" : "arrive", opts.boss && !foe.env ? "foe" : null);
  if (opts.boss) showBanner(foe.name, foe.env ? "survive it" : "the flagship");
  else if (foe.env) showBanner(foe.name, "survive until the drive spools");
  AUDIO.setBattle(true, !!opts.boss);
  layout();

function setHint(t){ $("hint").textContent = t || ""; }

/* ---------------- combat update ---------------- */
function update(dt){
  if (S.hitstop > 0){ S.hitstop -= dt; return; }
  if (S.slow > 0){ S.slow -= dt; dt *= 0.25; }
  const R_ = MOD.rules; S.t += dt;
  for (const [me, them] of [[S.you,S.foe],[S.foe,S.you]]){
    let cum = 0; const effW = eff(me,"weapons"); const jammed = them.cloakT > 0;
    // only crew who can work the console count (an ordinary Skitterer cannot: canMan); FTL C2: x0.90 / 0.85 / 0.80 of the time
    const gunners = crewAt(me,"weapons",me.key).filter(canMan), mt = R_.weaponsMannedTime;
    const manSpeed = !gunners.length ? 1 : Array.isArray(mt) ? 1/byLevel(mt, bestAt(me,"weapons","weapons")) : 1 + R_.weaponsMannedSpeed + 0.05*bestAt(me,"weapons","weapons");
    const speed = (manSpeed + (lumenIn(me,"weapons") ? 0.15 : 0)) * (me.you ? 1 : 1 + 0.08*(R.sector - 1));
    for (const w of me.weapons){
      if (w.on) cum += w.power;
      const powered = w.on && cum <= effW;
      if (!powered){ w.charge = Math.max(0, w.charge - dt*2); w.stack = 0; continue; }
      if (jammed) continue;
      if (!me.you && S.t < (R_.enemyQuietTime || 0)) continue; // their crew are still manning up
      const cd = w.cd * (1 - (w.chain || 0)*(w.stack || 0));
      w.charge = Math.min(cd, w.charge + dt*speed);
      if (!me.you && !w.target) w.target = enemyTarget(them);
      if (w.charge >= cd && w.target && room(them, w.target)){
        if (w.type === "missile" && me.missiles <= 0) continue;
        fire(me, them, w);
        w.charge = 0; if (w.chain) w.stack = Math.min(3, (w.stack || 0) + 1);
        if (!me.you) w.target = null;
      }
    }
    for (const g of gunners) gainXp(g, "weapons", dt*0.5);
    const ml = maxLayers(me);
    // shields: the next layer takes 2.0 / 2.0 / 1.72 / 1.5 / 1.33 s (FTL S2); a hit pops a layer but keeps the progress (S6)
    if (me.layers < ml){
      const tab = R_.shieldRechargeByLayer, need = Array.isArray(tab) ? tab[Math.min(me.layers, tab.length - 1)] : R_.shieldRecharge;
      me.shT += dt * (manned(me,"shields") ? 1.1 + 0.1*bestAt(me,"shields","shields") : 1);
      if (me.shT >= need){ me.layers++; me.shT = Math.max(0, me.shT - need); }
    } else { me.layers = ml; me.shT = 0; }
    for (const g of crewAt(me,"shields",me.key).filter(canMan)) gainXp(g, "shields", dt*0.5);
    for (const g of crewAt(me,"pilot",me.key).filter(canMan)) gainXp(g, "pilot", dt*0.5);
    for (const g of crewAt(me,"engines",me.key).filter(canMan)) gainXp(g, "engines", dt*0.5);
    for (const s of Object.values(me.sys)) if (s.ion > 0) s.ion = Math.max(0, s.ion - dt);
    if (me.cloakT > 0){ me.cloakT -= dt; if (me.cloakT <= 0){ me.cloakT = 0; me.cloakCd = R_.cloakCooldown; } }
    else if (me.cloakCd > 0 && eff(me,"cloak") > 0) me.cloakCd = Math.max(0, me.cloakCd - dt);
    if (me.sys.tele){ const lv = eff(me,"tele"); if (lv > 0) me.teleCharge = Math.min(1, me.teleCharge + dt/((Array.isArray(R_.teleportTimes) ? byLevel(R_.teleportTimes, lv) : R_.teleportTime*(1 - 0.2*(lv-1)))*(me.you ? 1 : 1.4))); }
    const locked = !them.env && warpLocked(me);
    if (me.you && locked && !S.saidLock){ S.saidLock = true; setHint(`Warp locked. The ${them.name}'s WARP LOCK holds your drive: shoot that room out to jump.`); }
    if ((me.you || me.fleeing) && !locked && manned(me,"pilot") && cap(me,"pilot") > 0 && eff(me,"engines") > 0)
      me.ftl = Math.min(1, me.ftl + dt*jumpRate(me, them)*(sizeRule(me).ftl || 1)*(me.you && them.env ? them.ftlMult : 1));
    updateDrones(me, them, dt);
    updateHazards(me, dt);
    updateOxygen(me, dt);
    me.flash = Math.max(0, me.flash - dt*3);
  }

function drawShip(ship, dt){

function drawFx(dt){
  if (!S.over) for (const p of S.fx){
    if (p.t < 0) continue;
    if (p.kind === "beam"){
      const from = rcenter(p.from, "weapons"), path = p.path.map(id => rcenter(p.to, id));
      const a = Math.min(1, p.t/0.3), fade = p.t > 0.75 ? Math.max(0, 1 - (p.t - 0.75)/0.15) : 1;
      const hot = p.w.dmg === 0 ? "255,150,60" : "255,110,200";
      let end = path[0];
      if (p.dodge){ end = {x: path[0].x + (p.to.you ? -1 : 1)*G(p.to).cell*1.6, y: path[0].y - G(p.to).cell}; }
      X.lineCap = "round";
      X.strokeStyle = `rgba(${hot},${0.85*fade})`; X.lineWidth = 3 + 2*Math.sin(p.t*50);
      X.beginPath(); X.moveTo(from.x, from.y); X.lineTo(from.x + (end.x - from.x)*a, from.y + (end.y - from.y)*a); X.stroke();
      if (!p.dodge && p.t > 0.3 && path.length){
        const prog = Math.min(1, (p.t - 0.3)/0.55)*(path.length - 1);
        X.strokeStyle = `rgba(${hot},${0.95*fade})`; X.lineWidth = 5;
        X.beginPath(); X.moveTo(path[0].x, path[0].y);
        for (let i = 1; i <= Math.floor(prog); i++) X.lineTo(path[i].x, path[i].y);
        const i0 = Math.floor(prog), fr = prog - i0; if (path[i0+1]) X.lineTo(path[i0].x + (path[i0+1].x - path[i0].x)*fr, path[i0].y + (path[i0+1].y - path[i0].y)*fr);
        X.stroke();
        X.strokeStyle = `rgba(255,240,250,${0.8*fade})`; X.lineWidth = 1.5; X.stroke();
        if (Math.random() < 0.7){ const q = path[Math.min(path.length-1, Math.round(prog))]; S.parts.push({x:q.x + rnd(-6,6), y:q.y + rnd(-6,6), vx:rnd(-60,60), vy:rnd(-60,60), life:.3, col:`rgb(${hot})`, s:2}); }
      }
      X.lineCap = "butt";
      continue;
    }
    const q = fxPos(p); p.cx = q.x; p.cy = q.y;
    const {x, y, from, tx, ty, k} = q;
    if (p.kind === "missile"){
      const hot = p.w.fire >= 0.9 ? "#ff7a3c" : "#ffc857";
      X.strokeStyle = "rgba(255,200,87,.5)"; X.lineWidth = 2; X.beginPath(); X.moveTo(from.x + (tx-from.x)*Math.max(0,k-.15), from.y + (ty-from.y)*Math.max(0,k-.15)); X.lineTo(x,y); X.stroke();
      X.fillStyle = hot; X.beginPath(); X.arc(x, y, p.w.dmg >= 3 ? 4.5 : 3.5, 0, 6.283); X.fill();
      if (Math.random() < 0.8) S.parts.push({x, y, vx:rnd(-10,10), vy:rnd(-10,10), life:.5, col:"#8a8f99", s:rnd(2,4), smoke:true});
    } else if (p.kind === "ion"){
      X.fillStyle = "rgba(157,140,255,.35)"; X.beginPath(); X.arc(x, y, 7 + 2*(p.w.ion || 1), 0, 6.283); X.fill();
      X.fillStyle = "#cfc6ff"; X.beginPath(); X.arc(x, y, 3 + (p.w.ion || 1), 0, 6.283); X.fill();
    } else if (p.w.flak){
      X.save(); X.translate(x, y); X.rotate(p.t*18); X.fillStyle = "#e6e2d6"; X.fillRect(-2.5, -1, 5, 2); X.fillRect(-1, -2.5, 2, 5); X.restore();
    } else {
      const heavy = p.w.dmg >= 2, col = p.w.chain ? "#ffd27a" : (p.from.you ? "#aef3ff" : "#ff9b7a");
      const len = heavy ? 0.1 : 0.06, bx = x - (tx-from.x)*len, by = y - (ty-from.y)*len;
      X.lineCap = "round";
      if (heavy){ X.strokeStyle = p.from.you ? "rgba(174,243,255,.35)" : "rgba(255,155,122,.35)"; X.lineWidth = 7; X.beginPath(); X.moveTo(bx, by); X.lineTo(x, y); X.stroke(); }
      X.strokeStyle = col; X.lineWidth = heavy ? 4 : 3; X.beginPath(); X.moveTo(bx, by); X.lineTo(x, y); X.stroke(); X.lineCap = "butt";
    }
  }
  for (const e of S.envFx || []){ e.life -= dt; const k = Math.min(1, (0.45 - e.life)/0.2); X.strokeStyle = e.col; X.globalAlpha = Math.max(0, e.life*2); X.lineWidth = 3; X.lineCap = "round"; X.beginPath(); X.moveTo(e.sx, e.sy); X.lineTo(e.sx + (e.x - e.sx)*k, e.sy + (e.y - e.sy)*k); X.stroke(); X.lineCap = "butt"; X.globalAlpha = 1; if (k >= 1 && !e.hit){ e.hit = true; for (let i = 0; i < 12; i++) S.parts.push({x:e.x, y:e.y, vx:rnd(-90,90), vy:rnd(-90,90), life:rnd(.2,.5), col:e.col, s:2}); } }
  S.envFx = (S.envFx || []).filter(e => e.life > 0);
  for (const z of S.zaps){ z.life -= dt; if (z.m.cx == null) continue; const d = dronePos(z.ship, z.d); X.strokeStyle = `rgba(159,232,255,${z.life*4})`; X.lineWidth = 2; X.beginPath(); X.moveTo(d.x, d.y); X.lineTo(z.m.cx, z.m.cy); X.stroke(); }

  X.textAlign = "center"; X.textBaseline = "middle";

  X.globalAlpha = 1; X.textAlign = "left"; S.floats = S.floats.filter(f => f.life > 0);

function drawParticles(dt){
  if (S.parts.length > 700) S.parts.splice(0, S.parts.length - 700);
  for (const q of S.parts){
    q.life -= dt; q.x += q.vx*dt; q.y += q.vy*dt;
    if (q.smoke){ q.s += dt*6; q.vx *= .98; q.vy *= .98; X.globalAlpha = Math.max(0, q.life*0.35); X.fillStyle = q.col; X.beginPath(); X.arc(q.x, q.y, q.s, 0, 6.283); X.fill(); continue; }

  }

// the part of the map canvas the chart may use: left of the side panel, below the threat line (canvas px).
// Every beacon is drawn inside it, with a margin, at every screen size (Michael's iPhone, 2026-10-04).
function mapView(){
  const b = stageRect(cv), dm = $("deckMap"); let x1 = W;
  if (dm && !dm.hidden){ const r = stageRect(dm); if (r.width > 0 && r.left - b.left < W) x1 = Math.max(W*0.3, r.left - b.left); }
  return {x0: 0, y0: 0, x1, y1: H, pad: 34, top: 48};
}
function mapGeom(){
  if (STAGE.ok && STAGE.nodeScreen.length === R.map.nodes.length) return {px: n => STAGE.nodeScreen[n.id].x, py: n => STAGE.nodeScreen[n.id].y, colX: () => -999, three: true};
  const v = mapView(), m = Math.max(24, v.x1*0.05), top = 44, bot = 28, w = v.x1 - 2*m;
  return {px: n => m + n.x*w, py: n => top + n.y*(H - top - bot), colX: c => m + (c/(R.map.cols-1))*w};
}
function drawMap(dt){
  const mg = mapGeom(), map = R.map, t = performance.now()/1000;
  const cur = map.nodes[R.pos];
  const reach = new Set(reachable());
  // threat front
  if (mg.three){ X.fillStyle = "rgba(255,140,150,.9)"; X.font = `600 10px "Chakra Petch", sans-serif`; X.textBaseline = "top"; X.textAlign = "left"; X.fillText(`${(R.arc ? R.arc.threat.name : "THE THREAT").toUpperCase()} \u00B7 ${Math.max(0, R.map.nodes[R.pos].col - R.threat)} JUMPS BEHIND`, 10, 10); X.fillStyle = "rgba(131,148,179,.7)"; X.fillText("DRAG TO LOOK AROUND", 10, 24); }
  else if (R.threat >= 0 || R.threat > -1.5){
    const colW = (mapView().x1 - 2*Math.max(24, mapView().x1*0.05))/(map.cols-1);
    const fx = mg.colX(R.threat) + colW*0.5;
    if (fx > 0){
      const gr = X.createLinearGradient(0,0,fx,0); gr.addColorStop(0, "rgba(255,61,90,.26)"); gr.addColorStop(1, "rgba(255,61,90,.1)");
      X.fillStyle = gr; X.beginPath(); X.moveTo(0,0); X.lineTo(fx, 0);
      for (let y = 0; y <= H; y += 12) X.lineTo(fx + Math.sin(y*0.05 + t*1.5)*8 + Math.sin(y*0.13 - t)*4, y);
      X.lineTo(0, H); X.closePath(); X.fill();
      X.strokeStyle = "rgba(255,61,90,.6)"; X.lineWidth = 1.5; X.stroke();
      X.fillStyle = "rgba(255,120,140,.9)"; X.font = `600 10px "Chakra Petch", sans-serif`; X.textBaseline = "top"; X.textAlign = "left";
      if (fx > 60) X.fillText((R.arc ? R.arc.threat.name : "THE THREAT").toUpperCase(), 10, 10);
    }
  }
  // edges
  for (const n of map.nodes) for (const j of n.links){
    const o = map.nodes[j]; if (j < n.id && o.links.includes(n.id)) continue;
    const active = (n.id === R.pos && reach.has(j)) || (j === R.pos && reach.has(n.id));
    X.strokeStyle = active ? "rgba(255,200,87,.55)" : "rgba(131,148,179,.2)"; X.lineWidth = active ? 1.6 : 1;
    if (active){ X.setLineDash([5,5]); X.lineDashOffset = -t*12; }
    X.beginPath(); X.moveTo(mg.px(n), mg.py(n)); X.lineTo(mg.px(o), mg.py(o)); X.stroke(); X.setLineDash([]);
  }
  // nodes
  const rN = Math.max(9, Math.min(14, W*0.022));
  for (const n of map.nodes){
    const x = mg.px(n), y = mg.py(n), over = n.col <= R.threat, vis = n.visited;
    if (reach.has(n.id)){ X.strokeStyle = `rgba(255,200,87,${0.35 + 0.25*Math.sin(t*4)})`; X.lineWidth = 1.5; X.beginPath(); X.arc(x, y, rN + 5 + Math.sin(t*4)*1.5, 0, 6.283); X.stroke(); }
    X.beginPath(); X.arc(x, y, rN, 0, 6.283);
    X.fillStyle = over ? "rgba(58,20,32,.8)" : (vis ? "rgba(17,24,38,.55)" : (mg.three ? "rgba(12,18,30,.55)" : "#182235")); X.fill();
    X.strokeStyle = over ? "#ff3d5a" : (vis ? "#2a3650" : "#4d5d7a"); X.lineWidth = 1.5; X.stroke();
    X.save(); X.translate(x, y); const s = rN*0.55; X.lineWidth = 1.8;
    const col = vis ? "#4d5d7a" : ({hostile:"#ff6b4a", event:"#d9e2f2", store:"#ffc857", wreck:"#9fb0cc", exit:"#7cf29a", flagship:"#ff3d5a", hazard:"#ff9f5a"})[n.type] || "#d9e2f2";
    X.strokeStyle = col; X.fillStyle = col;

    <span>CREW <b>${liveCrew().length}</b></span>
    <span class="${behind <= 1 ? "warn" : ""}">THREAT <b>${behind <= 0 ? "ON YOU" : behind + " behind"}</b></span>`;
